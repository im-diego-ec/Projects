schema: spec-driven
context: |
  Proyecto: Projects — marco de ingeniería de la organización.
  Qué es: el marco de trabajo (no una aplicación) que los proyectos del área
  adoptan para nacer ya cumpliendo el estándar. Condensa prácticas ya probadas
  en producción, no teoría de escritorio, y evoluciona con vida propia.
  Qué contiene, según cómo evoluciona cada pieza:
    - Referenciado: workflows reusables y composite actions que los proyectos
      consumen con `uses: <org>/Projects/...@v<major>`. Cambian una vez para todos.
    - Scaffold: plantillas que se copian UNA vez al crear el proyecto y luego
      son del proyecto (AGENTS.md, CODEOWNERS, plantilla de PR, configuración
      de lint y de agentes). Usan placeholders {{DOBLE_LLAVE}} documentados.
    - Canónico: los specs de marco (`openspec/specs/`) viven SOLO en este repo;
      los proyectos adoptantes no los copian, los cumplen. Qué parte de ese
      contrato tiene compuerta que falla sola —una fila por requirement, con la
      ruta y la línea del paso o del test, o «ninguno»— está medido en
      `openspec/cobertura-de-requirements.md`.
    - Regenerado: las skills y comandos de OpenSpec no se vendoran; el marco
      pina la versión del CLI y cada repo las regenera.
  Premisa dura: el cumplimiento del marco debe ser AUTOMÁTICO (CI, scaffolds,
  skills preconfiguradas). Un ritual que alguien debe recordar NO cuenta como
  enforcement: solo cuentan los checks que fallan solos.
  Invariantes: se enuncian como PROPIEDADES, nunca como implementaciones ni
  cantidades esperadas (un invariante con un número concreto aborta corridas
  legítimas con falsos fallos).
  Despersonalización: los specs canónicos no nombran personas, cuentas de nube,
  dominios, prefijos de recursos ni paquetes concretos; hablan de roles y de
  ambientes. Lo que el pipeline consume en runtime (URLs, ARNs, log groups)
  viaja por variables y secrets del proveedor de CI.
  Stack del marco: monorepo TypeScript con pnpm, GitHub Actions para CI/CD,
  AWS + Terraform para infraestructura.
  Idioma de specs: español en la prosa; keywords de OpenSpec en inglés.
rules:
  proposal:
    - Mencionar el impacto visible para quien adopta el marco (proyecto
      consumidor o builder), no solo el cambio interno
    - Declarar a qué categoría de distribución pertenece lo que cambia
      (referenciado, scaffold, canónico o regenerado) y si rompe a los
      adoptantes existentes
    - Abrir con un frontmatter YAML de CINCO campos obligatorios, en este
      orden - `artefacto`, `dri`, `aprueba`, `informado`, `estado`. No es
      decoración - `aprueba` es lo que decide quién gatea el change, y
      `informado` es lo único que mantiene al rol de producto en el circuito
      de los changes técnicos que su gate no cubre. Un proposal sin
      frontmatter deja a ese rol afuera sin que nada lo diga
    - "`artefacto` vale siempre `proposal`; `dri` y `aprueba` nombran ROLES
      con la persona entre paréntesis cuando haga falta; `informado` admite
      varios separados por `/`; `estado` es UNO de este conjunto cerrado -
      `pendiente-de-revision`, `aprobado-en-sesion`, `en-ejecucion`,
      `archivado`. Los campos opcionales que el marco ya usa son
      `experimental` (booleano) y `veredicto_antes_de` (fecha ISO), y van
      juntos - un change experimental sin fecha de veredicto es permanente
      por defecto"
    - "`dri` y `aprueba` NO pueden nombrar a la misma persona. Un autor que
      se aprueba a sí mismo no es un review, y hoy nada lo detiene - el
      repositorio corre con `required_approving_review_count` en `0` y
      `require_code_owner_review` en `false`, así que CODEOWNERS sugiere
      revisores y no gatea. Mientras esa configuración siga así, este campo
      es la única constancia escrita de quién revisó"
  specs:
    - Usar escenarios con viñetas WHEN / THEN bajo `#### Scenario:` (prosa en
      español, keywords en inglés). No usar Dado / Cuando / Entonces
    - Enunciar los requirements con SHALL como propiedades observables, sin
      nombres de recursos, cantidades esperadas ni detalles de implementación
      que cada proyecto fija por su cuenta
  design:
    - Registrar las alternativas descartadas con su motivo
    - "Nada de FUERA del change puede depender de una ruta de adentro de
      `openspec/changes/<nombre>/`. Es una carpeta transitoria por
      construcción - archivar la mueve a `changes/archive/` y descartar el
      change la borra -, así que una dependencia en esa dirección convierte un
      archive rutinario en un rojo de CI por algo que no tiene que ver con
      specs. Si el change necesita traer una herramienta o un arnés, vive
      fuera de `openspec/changes/` desde el primer commit. La guarda que lo
      hace cumplir corre en el paso 2 de la skill de archivado
      (`aplicar-deltas.mjs`), que sale 1 y no escribe nada"
    - Justificar cómo el cambio se hace cumplir solo (qué check falla si
      alguien no lo cumple); si el cumplimiento depende de que alguien se
      acuerde, decirlo explícitamente como deuda
  tasks:
    - Tareas pequeñas, ejecutables en un paso
    - Cada tarea deja evidencia verificable (comando corrido, check en verde,
      archivo creado)
