name: Cobertura de las lineas del cambio y del total por paquete
description: >-
  Mide la cobertura de pruebas en los DOS planos que el marco exige: las líneas
  que el pull request agrega o modifica, cruzando los reportes lcov con el diff,
  y el TOTAL de cada paquete contra el mínimo del marco. Sin datos habiendo
  líneas agregadas es ROJO, nunca cobertura total.
author: la organización

# ---------------------------------------------------------------------------
# PERMISOS MINIMOS QUE DEBE CONCEDER EL CONSUMIDOR
#
#   permissions:
#     contents: read   # el checkout previo y el fetch de la base
#
# No llama a la API de GitHub: todo sale de git y de archivos del checkout.
#
# REQUISITOS DEL JOB QUE LA USA
#   1. actions/checkout ANTES de esta action.
#      fetch-depth: 0 es lo recomendado. Con el default (1) la action intenta
#      traer sola el commit base con un fetch acotado; si el remoto no se lo
#      permite, el paso FALLA con el arreglo escrito, no pasa en verde.
#   2. Las pruebas CON cobertura ya corridas, emitiendo lcov. Sin reportes y
#      con lineas agregadas, este paso es rojo a proposito.
#   3. Las rutas SF: de los lcov tienen que ser relativas a la RAIZ del
#      repositorio. En un monorepo eso significa configurar el projectRoot del
#      reporter: sin eso, dos paquetes emiten "src/..." indistinguibles entre
#      si e incomparables contra el diff.
#   4. Para que el plano del TOTAL mida el codigo que ninguna prueba importa,
#      la cobertura del paquete tiene que emitirse con `all: true`. Sin eso el
#      reporte solo trae los archivos que alguna prueba toco y el total sale
#      alto por omision. El scaffold reparte esa configuracion ya armada en
#      `vitest.config.base.ts`.
#
# LOS DOS PLANOS Y SUS COMPUERTAS
#   Plano del CAMBIO: las lineas que el diff agrega o modifica, contra `minimo`.
#     No aplica fuera de un pull request (no hay rango) y lo dice.
#   Plano del TOTAL: la cobertura total de cada paquete contra el minimo del
#     marco. Corre SIEMPRE, tambien en un push a main. Es rojo si un paquete
#     esta por debajo del minimo sin declarar motivo y fecha, si esa fecha
#     vencio, si retrocedio por debajo de su piso declarado, o si su
#     declaracion esta mal escrita. Es amarillo, con el faltante y el plazo
#     restante en el resumen, si la deuda esta declarada y vigente.
#     La declaracion vive en el package.json del propio paquete:
#       "projects": { "cobertura": {
#           "excluidos": [{ "patron": "...", "motivo": "..." }],
#           "piso": { "lineas": 0, "funciones": 0, "ramas": 0 },
#           "deuda": { "motivo": "...", "fecha": "AAAA-MM-DD" } } }
#
# POR QUE UN COMPARADOR PROPIO Y NO UNA HERRAMIENTA EXTERNA (design D5)
#   La candidata FALLA EN VERDE: si las rutas de su entrada no coinciden con
#   las del diff, no encuentra lineas que medir, reporta cobertura total y sale
#   con exito. Cablearla mal deja el gate abierto. Este comparador hace lo
#   contrario: "no hay datos" habiendo lineas agregadas es rojo ruidoso.
# ---------------------------------------------------------------------------

inputs:
  lcov:
    description: >-
      Patrones glob de los reportes lcov, uno por línea. Se admiten líneas en
      blanco y comentarios con "#". Soporta `**`, `*`, `?` y `{a,b}`, y no
      entra nunca a `node_modules` ni a `.git`.
    required: false
    default: "**/coverage/lcov.info"
  base:
    description: >-
      Commit base del rango. Vacío significa que el paso NO APLICA (no hay
      rango que medir) y lo dice en el resumen, en vez de simular un 100%.
      El default lo deja vacío fuera de un pull request.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  cabeza:
    description: >-
      Commit final del rango. El default (`HEAD`) es lo correcto casi siempre:
      es lo que dejó el checkout y lo que midieron las pruebas.
    required: false
    default: HEAD
  minimo:
    description: >-
      Porcentaje mínimo de cobertura exigido sobre las líneas del cambio. El
      mínimo del marco es 80 (decisión D5 del change calidad-fail-closed).
      Sobre las líneas del cambio se puede bajar —con un `::warning::` que lo
      deja escrito en la corrida—, pero sobre el TOTAL de cada paquete el 80 es
      piso DURO: acá el umbral local solo puede SUBIRLO. Bajarlo a 40 dejaba en
      verde un paquete al 33%, que es la medición que originó esa asimetría.
    required: false
    default: "80"
  max-anotaciones:
    description: >-
      Tope de anotaciones `::error file=...` que se emiten sobre líneas sin
      cubrir. El listado completo va siempre al resumen de la corrida.
    required: false
    default: "20"
  instalar-node:
    description: >-
      "true" para instalar Node con actions/setup-node. Ponlo en "false" si el
      job ya hizo su propio setup-node y no quieres pagarlo dos veces (el caso
      normal: para llegar acá el job ya corrió las pruebas).
    required: false
    default: "false"
  version-node:
    description: Versión de Node a instalar cuando instalar-node es "true".
    required: false
    default: "22"

outputs:
  porcentaje:
    description: >-
      Porcentaje de líneas del cambio cubiertas, con dos decimales. Vale
      "n/a" cuando no hubo nada que medir (paso no aplicable, cambio que solo
      borra, o cambio sin archivos que la cobertura mida).
    value: ${{ steps.medir.outputs.porcentaje }}
  lineas_medidas:
    description: Cantidad de líneas agregadas o modificadas con dato de cobertura.
    value: ${{ steps.medir.outputs.lineas_medidas }}
  lineas_sin_cubrir:
    description: Cantidad de esas líneas que ninguna prueba ejercita.
    value: ${{ steps.medir.outputs.lineas_sin_cubrir }}
  lineas_fuera_de_medicion:
    description: >-
      Líneas fuente del cambio que quedaron FUERA del denominador porque
      ningún reporte tiene dato para ellas. Un porcentaje publicado sin este
      número miente por omisión: una línea cubierta y cincuenta sin dato dan
      "100.00" sobre una cobertura real del 2%.
    value: ${{ steps.medir.outputs.lineas_fuera_de_medicion }}
  paquetes_medidos:
    description: Paquetes cuyo total pudo medirse en esta corrida.
    value: ${{ steps.medir.outputs.paquetes_medidos }}
  paquetes_bajo_minimo:
    description: >-
      Paquetes cuyo total está por debajo del mínimo del marco, con deuda
      declarada o sin ella. Es la deuda que la corrida reporta SIEMPRE, para que
      no se descubra el día en que vence.
    value: ${{ steps.medir.outputs.paquetes_bajo_minimo }}
  paquetes_en_rojo:
    description: >-
      Paquetes que hacen fallar el plano del total: por debajo del mínimo sin
      plazo declarado, con el plazo vencido, en retroceso respecto de su piso, o
      con su declaración de cobertura mal escrita.
    value: ${{ steps.medir.outputs.paquetes_en_rojo }}

runs:
  using: composite
  steps:
    # El comparador es un script sin dependencias: alcanza con un Node moderno.
    - name: Node para el comparador
      if: inputs.instalar-node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.version-node }}

    - name: Cobertura de las lineas del cambio
      id: medir
      shell: bash
      env:
        COBERTURA_LCOV: ${{ inputs.lcov }}
        COBERTURA_BASE: ${{ inputs.base }}
        COBERTURA_CABEZA: ${{ inputs.cabeza }}
        COBERTURA_MINIMO: ${{ inputs.minimo }}
        COBERTURA_MAX_ANOTACIONES: ${{ inputs.max-anotaciones }}
      # GITHUB_ACTION_PATH apunta a la copia de ESTA action (projects), no al repo
      # del consumidor: por eso el script viaja con la action y el proyecto no
      # vendora ninguna copia que se pueda quedar vieja. Un checkout del repo
      # del marco daria 404 — el GITHUB_TOKEN del consumidor no lee otro repo
      # (comprobado el 2026-08-14).
      #
      # EL setup-node DE ARRIBA ES CONDICIONAL, y por eso el guard no sobra: el
      # default de instalar-node es "false", asi que en la configuracion POR
      # DEFECTO esta action no instala nada y depende de que el job ya traiga
      # Node. Cuando no lo trae, sin guard el paso muere con
      # "node: command not found" — un mensaje del shell, que no dice ni que
      # instalar ni de quien es el job.
      run: |
        set -euo pipefail

        if ! command -v node > /dev/null 2>&1; then
          echo "::error::no hay 'node' en el PATH y sin el no se puede medir la cobertura del cambio. Arreglo: pasale 'instalar-node: true' a esta action (su default es 'false' porque para llegar aca el job normalmente ya corrio las pruebas), o agrega 'uses: actions/setup-node@v7' a este job, antes de este paso"
          exit 1
        fi

        node "${GITHUB_ACTION_PATH}/medir-cobertura-diff.mjs"
