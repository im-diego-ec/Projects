# Publica el sitio en Cloudflare Workers.
#
# CUANDO CORRE, y por que no en cada push. Solo cuando `ci-ok` termina en verde
# sobre `main`: publicar algo que no paso las verificaciones es exactamente lo
# que este marco existe para impedir. Un push a una rama no publica nada.
#
# QUE NECESITA PARA FUNCIONAR, y son dos cosas que solo una persona puede hacer:
#   1. Una cuenta de Cloudflare (gratis, sin tarjeta).
#   2. Dos secretos en Settings -> Secrets and variables -> Actions:
#        CLOUDFLARE_API_TOKEN    con permiso "Edit Cloudflare Workers"
#        CLOUDFLARE_ACCOUNT_ID   el identificador de tu cuenta
#
# EL PASO A PASO ESTA EN `{{PAQUETE_SITIO}}/README.md`. Mientras los secretos no
# existan, este workflow NO se pone rojo: sale con un aviso diciendo que falta.
# Un rojo permanente por algo que todavia no se configuro ensena a ignorar los
# rojos, que es peor que no tener la compuerta.
name: desplegar

on:
  workflow_run:
    # EL NOMBRE VA EXACTO, y este decia "ci" mientras el workflow se llama "CI".
    # `workflow_run` resuelve por el `name:` del otro archivo: si no coincide, no
    # falla nada — simplemente NO DISPARA NUNCA. Es la forma mas silenciosa que
    # hay de quedarse sin despliegue, porque no deja ni un rojo que mirar.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # A mano, para la primera vez y para volver atras.
  workflow_dispatch:
    inputs:
      sin_esperar_ci:
        description: >-
          Publicar aunque las verificaciones de este commit no estén en verde.
          Apartarse se puede; apartarse en silencio no: queda escrito en la corrida.
        type: boolean
        default: false

# El minimo: leer el arbol. Publicar lo hace la credencial, no el permiso del
# workflow.
permissions:
  contents: read
  # Para preguntar por el estado de `ci-ok` sobre el commit que se va a publicar,
  # cuando la corrida se dispara a mano.
  checks: read

concurrency:
  # Dos publicaciones a la vez sobre el mismo destino es una carrera con ganador
  # impredecible, asi que se serializan. Pero HACEN COLA: NO se cancelan.
  #
  # Es lo que exige `openspec/specs/despliegue-ci/spec.md` del marco, y la
  # distincion que gobierna la regla esta escrita ahi: una corrida de
  # VERIFICACION interrumpida no deja nada, asi que cancelarla es correcto y
  # ahorra recursos; una corrida de DESPLIEGUE interrumpida si deja estado —el
  # ambiente queda en una combinacion que ninguna de las dos corridas describe, y
  # las dos pueden reportar exito—.
  #
  # Ese desenlace, dos corridas en verde y el destino a medias, es exactamente lo
  # que este archivo existe para impedir. Este workflow decia
  # `cancel-in-progress: true` y defendia lo contrario en un comentario.
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desplegar:
    # `workflow_run` dispara TAMBIEN cuando el workflow anterior fallo: sin este
    # `if`, un CI rojo publicaria igual.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los permisos van tambien EN EL JOB, no solo arriba: el marco lo exige en
    # los dos arboles porque un job sin permisos propios hereda los del
    # repositorio, que pueden ser mas amplios de lo que este job necesita.
    permissions:
      contents: read
      checks: read
    steps:
      # UNA CORRIDA A MANO NO SE SALTEA LA COMPUERTA, y hasta este cambio si lo
      # hacia: el `if` del job acepta `workflow_dispatch` sin mirar nada, y el
      # unico camino que la guia da para la PRIMERA publicacion es apretar «Run
      # workflow». O sea que la promesa en negrita —«solo se publica lo que esta
      # en verde»— no valia justo para el unico camino documentado.
      #
      # Ahora la corrida a mano PREGUNTA por el estado de este commit. Y el
      # apartamiento existe, con un nombre y una casilla: queda escrito en la
      # corrida en vez de ocurrir en silencio.
      - name: Comprobar que este commit paso las verificaciones
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIN_ESPERAR: ${{ inputs.sin_esperar_ci }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${SIN_ESPERAR}" = "true" ]; then
            echo "::warning::se pidio publicar SIN esperar a las verificaciones. Queda escrito acá: el commit ${SHA} se publica sin que este workflow haya comprobado que su CI esta en verde"
            exit 0
          fi
          ESTADO="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --jq '[.check_runs[] | select(.name == "ci-ok")] | first | .conclusion // "sin-corrida"' 2>/dev/null || echo "no-se-pudo-leer")"
          echo "ci-ok sobre ${SHA}: ${ESTADO}"
          if [ "${ESTADO}" != "success" ]; then
            echo "::error::este commit no tiene ci-ok en verde (esta en \"${ESTADO}\"), asi que no se publica. Es la misma regla que aplica a las publicaciones automaticas, y vale igual cuando la corrida se dispara a mano. Si de verdad hace falta publicar igual, volve a disparar el workflow marcando la casilla \"sin_esperar_ci\": el apartamiento queda escrito en la corrida"
            exit 1
          fi

      - name: Traer el arbol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SE PUBLICA EL COMMIT QUE PASO EL CI, NO LA PUNTA DE main.
          #
          # Un checkout pelado bajo `workflow_run` trae lo que `main` apunte EN
          # ESTE MOMENTO, que no es necesariamente lo que verifico la corrida que
          # disparo este workflow: entre que el CI termina y esto arranca puede
          # entrar otro merge. Publicar codigo que ningun CI aprobo es
          # exactamente lo que este marco existe para impedir, y ademas seria
          # silencioso: las dos corridas reportarian exito.
          #
          # `head_sha` es el commit que el CI midio. En un disparo a mano
          # (`workflow_dispatch`) ese campo no existe y queda vacio, que es como
          # se le pide a checkout el comportamiento por defecto.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Comprobar que la credencial existe, y NO fallar si no
        id: credencial
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ] || [ -z "${CUENTA}" ]; then
            echo "hay=no" >> "${GITHUB_OUTPUT}"
            echo "::warning::todavia no se puede publicar: faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID. El paso a paso para crearlos esta en {{PAQUETE_SITIO}}/README.md. Esto NO es un fallo del proyecto: es una tarea humana pendiente, y se dice en amarillo a proposito"
            exit 0
          fi
          echo "hay=si" >> "${GITHUB_OUTPUT}"

      - name: Node y el gestor de paquetes
        if: steps.credencial.outputs.hay == 'si'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Instalar
        if: steps.credencial.outputs.hay == 'si'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Compilar el sitio
        if: steps.credencial.outputs.hay == 'si'
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm -C {{PAQUETE_SITIO}} run build
          # UN CERO ACA ES EL DESPLIEGUE ROTO, no un sitio limpio: publicar un
          # directorio vacio deja el dominio sirviendo nada y sin ningun error.
          CUANTOS="$(find {{PAQUETE_SITIO}}/dist -type f | wc -l | tr -d ' ')"
          if [ "${CUANTOS}" -eq 0 ]; then
            echo "::error::la compilacion no dejo un solo archivo en {{PAQUETE_SITIO}}/dist. No se publica nada"
            exit 1
          fi
          echo "a publicar: ${CUANTOS} archivo(s)"

      - name: Publicar
        id: publicar
        if: steps.credencial.outputs.hay == 'si'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # La salida se GUARDA ademas de imprimirse: de ella sale la direccion que
          # el paso siguiente va a consultar. `tee` para que el log del runner siga
          # mostrando todo tal cual, que es donde se lee cuando algo falla.
          corepack pnpm -C {{PAQUETE_SITIO}} exec wrangler deploy 2>&1 | tee /tmp/wrangler.txt

          # La ultima direccion que wrangler nombra es la del despliegue que acaba
          # de hacer. Si no se pudo leer NO se inventa una: el paso siguiente lo
          # dice y no afirma que el sitio este arriba.
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler.txt | tail -1 || true)"
          if [ -z "$URL" ]; then
            URL="$(grep -Eo 'https://[A-Za-z0-9._-]+' /tmp/wrangler.txt | grep -v 'cloudflare.com\|npmjs\|github.com' | tail -1 || true)"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────────
      # QUE EL DESPLIEGUE HAYA SALIDO 0 NO ES QUE EL SITIO CONTESTE.
      #
      # Hasta este paso, el workflow terminaba imprimiendo "publicado" sin haber
      # consultado nunca la direccion. Un verde que no midio nada: wrangler puede
      # subir los archivos y el sitio quedar sirviendo un 404 --una ruta base mal
      # puesta, un adaptador que no se aplico, un subdominio que todavia no
      # existe-- y el pipeline se ponia igual de verde.
      #
      # SE REINTENTA, y no es disimular un rojo: la primera publicacion de un
      # workers.dev tarda unos segundos en resolver por DNS, y un unico intento
      # convertiria eso en un rojo que se arregla solo. Cinco intentos con espera
      # creciente cubren esa ventana; lo que no conteste despues de eso no esta
      # arriba, y entonces el rojo es correcto.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Comprobar que la direccion contesta de verdad
        if: steps.credencial.outputs.hay == 'si'
        shell: bash
        env:
          URL: ${{ steps.publicar.outputs.url }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::error::se publico pero no se pudo leer la direccion de la salida de wrangler, asi que NO se comprobo que el sitio conteste. El log del paso anterior la tiene; abrila a mano antes de dar el despliegue por bueno"
            exit 1
          fi

          # El cuerpo baja al espacio de trabajo y no a /tmp: en el runner los dos
          # existen, pero este mismo script se corre en un banco y ahi el destino
          # tiene que ser una carpeta que el proceso controle.
          CUERPO="${RUNNER_TEMP:-.}/cuerpo-del-sitio.html"

          for intento in 1 2 3 4 5; do
            # `|| CODIGO=000` DESPUES de la sustitucion y no adentro: con el `||`
            # adentro, curl imprime su 000 y el echo agrega otro, y lo que se veia
            # en el log era "contesto 000000". Un codigo de estado inventado por
            # una concatenacion es peor que no tenerlo.
            CODIGO="$(curl -sS -o "$CUERPO" -w '%{http_code}' --max-time 20 "$URL")" || CODIGO=000
            # Y el tamanio SOLO si el archivo existe: cuando curl no llega a
            # ningun lado no lo crea, y `wc` sobre lo que no esta deja TAM vacio,
            # que despues rompe la comparacion numerica de abajo con un error de
            # bash en vez de un rojo que se entienda.
            if [ -s "$CUERPO" ]; then TAM=$(wc -c < "$CUERPO" | tr -d " "); else TAM=0; fi
            if [ "$CODIGO" = "200" ] && [ "$TAM" -gt 0 ]; then
              echo "::notice title=Tu sitio esta en linea::$URL contesto 200 con $TAM bytes"
              {
                echo "### Tu sitio esta publicado"
                echo ""
                echo "**$URL**"
                echo ""
                echo "Comprobado desde el runner: contesto 200 con $TAM bytes. No es que el despliegue haya salido bien; es que la pagina abre."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # La espera se duplica pero el total se corta: 3+6+12+24 son 45
            # segundos, de sobra para la propagacion de un workers.dev nuevo y
            # poco para un sitio que de verdad no esta. Esperar minutos por algo
            # que no va a cambiar es un rojo que llega tarde.
            #
            # Despues del ULTIMO intento no se espera: no queda nadie a quien
            # darle tiempo, y esos segundos solo retrasan el rojo.
            if [ "$intento" -eq 5 ]; then break; fi
            ESPERA=$((3 * (2 ** (intento - 1))))
            echo "intento $intento: $URL contesto $CODIGO con $TAM bytes; espero ${ESPERA}s"
            sleep "$ESPERA"
          done

          echo "::error::se publico y la direccion NO contesta: $URL devolvio $CODIGO despues de cinco intentos. El despliegue subio los archivos, asi que el problema esta del lado de servirlos: la causa mas comun la primera vez es que falte registrar el subdominio en Workers & Pages -> Subdomain. Ver {{PAQUETE_SITIO}}/README.md"
          exit 1
