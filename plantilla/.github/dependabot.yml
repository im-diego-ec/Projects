# Dependabot — actualizaciones automaticas de dependencias.
# Politica del marco (ver fronteras ⚠️ en AGENTS.md): cada ecosistema abre PRs
# semanales; minor+patch llegan AGRUPADOS en un solo PR para no inundar y los
# mergea cualquier builder con la promocion en verde. Los majors llegan SOLOS
# porque pueden romper: sesion dedicada, orden de riesgo (devDeps -> runtime ->
# auth) y verificacion real en dev antes de prod. Sin auto-merge en ningun caso.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-y-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # DOS GRUPOS, y el marco va SOLO en el suyo. Con un unico grupo `*`,
    # Dependabot no abre un segundo PR mientras el del grupo siga abierto: da las
    # demas dependencias por «manejadas» y espera actualizar el PR existente.
    # Medido el 2026-08-21: la 1.4.1 del marco no se propuso porque habia un PR
    # abierto del grupo por `actions/upload-artifact`, de v4 a v7 —tres majors de
    # salto, o sea un PR que con razon puede quedarse quieto semanas— y el log lo
    # dijo textual: «Adding dependencies as handled: (..., projects/...)».
    #
    # El marco es la dependencia cuyo aviso importa: es la que trae checks nuevos y
    # arreglos de seguridad, y los PRs de su bump son ademas el censo de quien lo
    # consume. Agruparla con el resto la vuelve rehen del PR mas trabado.
    groups:
      marco:
        patterns: ["{{ORG}}/Projects*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["{{ORG}}/Projects*"]

  - package-ecosystem: "docker"
    directory: "/{{PAQUETE_API}}"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Solo se ignoran las versiones IMPARES de node (no-LTS, soporte corto).
      # Las PARES (LTS) SI llegan como PR automatico — la deteccion no se apaga,
      # se filtra. Ajustar la lista si el proyecto arranca en otra mayor.
      - dependency-name: "node"
        versions: ["23-slim", "25-slim", "27-slim", "29-slim"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "terraform"
    directory: "/infra-prod"
    schedule:
      interval: "weekly"
      day: "monday"
