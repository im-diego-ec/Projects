name: Marco CI (reusable)

# ---------------------------------------------------------------------------
# QUE ES ESTO
#
# Los jobs de CI que TODO proyecto la organización hereda del marco Projects:
#
#   1. cambios   -> detecta si el PR/push toca solo documentacion (carril rapido)
#   2. openspec  -> guardrail de deltas + validacion estricta de changes y specs
#   3. higiene   -> lo que el marco AFIRMA y hasta hoy nadie verificaba:
#                   artefactos regenerados al dia, definiciones de pipeline
#                   validas, cero marcadores del scaffold sin resolver,
#                   scripts de verificacion que no enmascaran su fallo y el
#                   censo de fuentes efectivamente cableado
#   4. marco-ok  -> veredicto agregado de los tres jobs anteriores
#
# El proyecto consumidor NO copia estos jobs: los referencia. Un arreglo aca
# arregla el CI de todos los repos a la vez.
#
# ---------------------------------------------------------------------------
# COMO LO CONSUME UN PROYECTO
#
# En {{PROYECTO}}/.github/workflows/ci.yml:
#
#   name: CI
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
#   # OBLIGATORIO. Un workflow reusable NUNCA puede pedir mas permisos que los
#   # que le concede quien lo llama: si aca falta pull-requests:read, el job
#   # "cambios" no puede listar los archivos del PR, cae al fail-open y el
#   # carril rapido no actua nunca (incidente real del 2026-08-05).
#   permissions:
#     contents: read
#     pull-requests: read
#
#   jobs:
#     marco:
#       uses: {{ORG}}/Projects/.github/workflows/marco-ci.yml@v1
#       # Opcional: solo si el default no sirve para este repo.
#       # with:
#       #   version_openspec: "1.9.0"
#
#     build_test:
#       name: build-test
#       needs: marco
#       if: needs.marco.outputs.solo_docs == 'false'
#       runs-on: ubuntu-latest
#       steps: [...]   # lo del producto: lint, typecheck, test, build
#
#     # EL CHECK REQUERIDO DEL RULESET ES ESTE, no build-test. build-test queda
#     # "skipped" en el carril de docs y un check omitido NO REPORTA NUNCA: si
#     # fuera el requerido, todo PR de solo docs quedaria esperando para siempre
#     # una senal que no llega. ci-ok reporta en AMBOS carriles.
#     ci_ok:
#       name: ci-ok
#       needs: [marco, build_test]
#       if: always()
#       runs-on: ubuntu-latest
#       steps:
#         - name: Veredicto
#           run: |
#             [ "${{ needs.marco.result }}" = "success" ] || { echo "::error::el CI de marco fallo"; exit 1; }
#             if [ "${{ needs.build_test.result }}" = "success" ]; then exit 0; fi
#             if [ "${{ needs.build_test.result }}" = "skipped" ] && [ "${{ needs.marco.outputs.solo_docs }}" = "true" ]; then
#               echo "solo docs: build-test omitido a proposito"; exit 0
#             fi
#             echo "::error::build-test termino en '${{ needs.build_test.result }}'"; exit 1
#
# El scaffold de {{PROYECTO}} ya trae ese ci.yml armado: no hay que escribirlo
# a mano. Y el ruleset main-protegida debe exigir el check "ci-ok".
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      version_openspec:
        description: >-
          Version pineada del CLI de OpenSpec. OJO: el paquete es
          @fission-ai/openspec; el nombre pelado "openspec" en npm es un
          placeholder ajeno (0.0.0, squatting). Dependabot NO ve este pin
          porque mira manifests, no un npx inline: se sube a mano aca y todos
          los repos del marco lo heredan.
        type: string
        required: false
        default: "1.9.0"
      version_node:
        description: Version de Node para el guardrail y el CLI de OpenSpec.
        type: string
        required: false
        default: "22"
      version_actionlint:
        description: >-
          Version pineada de actionlint, el validador de las definiciones de
          pipeline. Se descarga del release oficial y se verifica el sha256
          contra el archivo de checksums del MISMO release: eso protege de una
          descarga corrupta o de un asset cambiado, no de un release
          comprometido de raiz. Dependabot no lo ve (no es un manifest): se
          sube a mano aca y llega a todos los repos.
        type: string
        required: false
        default: "1.7.12"
      rutas_carril_docs:
        description: >-
          Patrones (ERE de grep, uno por linea) de las rutas que NO alteran lo
          que se sirve en runtime. Si el cambio completo cae dentro de estos
          patrones, solo_docs=true y el consumidor puede omitir su build/test.
          Se admiten lineas en blanco y comentarios con #.
        type: string
        required: false
        default: |
          ^openspec/
          \.md$
          ^docs/
          ^\.github/
          ^infra/
          ^infra-prod/
      runner:
        description: Runner para todos los jobs de marco.
        type: string
        required: false
        default: ubuntu-latest
    outputs:
      solo_docs:
        description: >-
          "true" si el cambio toca UNICAMENTE rutas del carril de docs. El
          consumidor lo usa para decidir si corre su build/test.
        value: ${{ jobs.cambios.outputs.solo_docs }}
      deteccion_confiable:
        description: >-
          "false" si la deteccion no pudo leer la lista real de archivos y
          cayo al fail-open (solo_docs queda en false y corre el CI completo).
        value: ${{ jobs.cambios.outputs.confiable }}

# Techo de permisos de los jobs del marco. Esto NO agrega permisos: el maximo
# lo fija el workflow llamador. Ver el bloque "COMO LO CONSUME UN PROYECTO".
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detecta si el cambio es SOLO documentacion. Fail-open: ante cualquier duda
  # o error de deteccion, solo_docs=false y corre el CI completo — nunca se
  # omite la validacion de codigo en silencio. Y el fail-open es RUIDOSO
  # (::warning): el 2026-08-05 este fallo fue mudo durante una semana.
  cambios:
    name: cambios
    runs-on: ${{ inputs.runner }}
    outputs:
      solo_docs: ${{ steps.detectar.outputs.solo_docs }}
      confiable: ${{ steps.detectar.outputs.confiable }}
    steps:
      # Solo el carril de push necesita el arbol git (para el diff del rango).
      # En PR se lista por API, que es lo correcto para merge, squash y rebase.
      - name: Checkout (solo para el diff de push)
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: detectar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO_PR: ${{ github.event.pull_request.number }}
          ANTES: ${{ github.event.before }}
          RUTAS_DOCS: ${{ inputs.rutas_carril_docs }}
        run: |
          SOLO_DOCS=false
          CONFIABLE=true

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMERO_PR}/files" \
                --paginate --jq '.[].filename' > files.txt 2> gh-error.txt; then
              echo "::warning::no se pudieron listar los archivos del PR — se corre el CI completo (fail-open). Detalle: $(tr '\n' ' ' < gh-error.txt)"
              # Origen preciso: el 2026-08-05 la causa fue exactamente esta y el
              # sintoma era invisible (todo PR corria el CI completo "porque si").
              if grep -qiE 'not accessible|403|Resource not accessible by integration' gh-error.txt; then
                echo "::warning::pinta a permisos: el workflow llamador debe declarar 'permissions: pull-requests: read' (incidente 2026-08-05)"
              fi
              CONFIABLE=false
              : > files.txt
            fi
          else
            if [ -z "${ANTES}" ] || [ "${ANTES}" = "0000000000000000000000000000000000000000" ]; then
              echo "::warning::no hay commit previo comparable (push inicial, rama nueva o dispatch) — se corre el CI completo (fail-open)"
              CONFIABLE=false
              : > files.txt
            elif ! git diff --name-only "${ANTES}" "${GITHUB_SHA}" > files.txt; then
              echo "::warning::git diff fallo entre ${ANTES} y ${GITHUB_SHA} — se corre el CI completo (fail-open)"
              CONFIABLE=false
              : > files.txt
            fi
          fi

          echo "== archivos del cambio =="
          cat files.txt

          # Los patrones llegan uno por linea: se limpian y se unen con "|".
          PATRON=$(printf '%s\n' "${RUTAS_DOCS}" \
            | tr -d '\r' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -vE '^(#|$)' \
            | paste -sd '|' -)
          echo "== patron del carril de docs =="
          echo "${PATRON}"

          if [ -z "${PATRON}" ]; then
            # Un ERE vacio hace match con TODA linea: sin este corte, "no queda
            # nada fuera del carril" seria cierto siempre y un cambio de codigo
            # se colaria como solo-docs. Fail-open explicito.
            echo "::warning::rutas_carril_docs quedo vacio — se corre el CI completo (fail-open)"
            CONFIABLE=false
          elif [ "${CONFIABLE}" = "true" ]; then
            set +e
            grep -vE "${PATRON}" files.txt > fuera-del-carril.txt
            RC=$?
            set -e
            if [ "${RC}" -gt 1 ]; then
              # grep devuelve >1 solo por error real (ERE invalido, etc.).
              echo "::warning::el patron del carril de docs no compilo (grep rc=${RC}) — se corre el CI completo (fail-open)"
              CONFIABLE=false
            elif [ -s files.txt ] && [ ! -s fuera-del-carril.txt ]; then
              SOLO_DOCS=true
            else
              echo "== archivos fuera del carril de docs =="
              cat fuera-del-carril.txt
            fi
          fi

          echo "solo_docs=${SOLO_DOCS}" >> "$GITHUB_OUTPUT"
          echo "confiable=${CONFIABLE}" >> "$GITHUB_OUTPUT"
          echo "solo_docs=${SOLO_DOCS} confiable=${CONFIABLE}"

  # Validacion de OpenSpec: barata (sin DB, sin install del monorepo) y corre
  # SIEMPRE, sea docs o codigo. Aqui viven el guardrail de deltas y la
  # validacion estricta de todos los changes y specs.
  openspec:
    name: openspec
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout del repo consumidor
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: "${{ inputs.version_node }}" }

      - name: Exigir OpenSpec en el repo
        shell: bash
        run: |
          [ -d openspec ] || {
            echo "::error::el repo no tiene openspec/ — el marco Projects exige que las specs vivan en el repo"
            exit 1
          }

      # Un bloque "## MODIFIED Requirements" REEMPLAZA al requirement completo
      # en el spec vigente al archivar: si el delta omite un escenario que el
      # spec ya tenia, ese escenario se BORRA. Paso el 2026-07-31 y lo atrapo
      # la herramienta recien en el ultimo paso del change; aca se detecta en
      # cada PR, sin depender de que alguien se acuerde de mirarlo.
      #
      # El guardrail viaja como composite action del marco: GitHub la descarga
      # igual que a este workflow, resolviendola por la configuracion de Actions
      # de la organizacion. NO se hace checkout del repo del marco — el
      # GITHUB_TOKEN del consumidor no tiene lectura sobre otro repo y daria 404
      # (comprobado el 2026-08-14 en la validacion de Fase 2). El script viaja
      # DENTRO de la action, asi que ningun proyecto vendora una copia que se
      # pueda quedar vieja.
      #
      # La ref es literal por obligacion: GitHub NO admite expresiones en el
      # campo "uses". Apunta a @v1 —el mismo tag movil que consumen los
      # proyectos— asi la action y este workflow avanzan juntos y no hay que
      # tocar esta linea en cada release.
      - name: Deltas de OpenSpec sin perdida de escenarios
        uses: im-diego-ec/Projects/actions/guardrail-deltas@v1
        with:
          instalar-node: "false"

      - name: Validacion estricta de changes y specs
        shell: bash
        env:
          VERSION_OPENSPEC: ${{ inputs.version_openspec }}
        run: npx --yes "@fission-ai/openspec@${VERSION_OPENSPEC}" validate --all --strict

  # Los checks que hacen que el marco se cumpla SOLO. Cada uno cierra un hueco
  # donde el marco AFIRMABA algo (en un README, en una guia de bootstrap, en un
  # comentario de YAML) y nada lo verificaba.
  #
  # Corre SIEMPRE, tambien en el carril rapido de docs: las definiciones de
  # pipeline caen dentro de ese carril (^\.github/) porque no se sirven en
  # runtime — pero si se EJECUTAN, y un error en ellas se manifiesta en la
  # corrida siguiente, cuando el cambio ya esta integrado y, en el caso del
  # marco, cuando otros repos ya lo consumen.
  higiene:
    name: higiene
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      # HUECO 1 — "regenerado" era la unica forma de distribucion del marco que
      # se apoyaba solo en que alguien se acordara de ejecutarla. El marco pina
      # la version del CLI y delega la regeneracion en cada repo; hasta hoy,
      # nada comparaba una cosa con la otra (un-proyecto-anterior vivio tres
      # minors atrasado sin que se notara).
      #
      # Se comparan DECLARACIONES, no contenidos: cada artefacto lleva en su
      # cabecera la version que lo genero. Regenerar en CI y diffear el arbol
      # seria sensible a cualquier diferencia cosmetica de entorno y convertiria
      # un check de segundos en uno fragil. Limite asumido y declarado: detecta
      # divergencia de VERSION, no edicion manual del contenido.
      #
      # El unico dato con el que este check trabaja es la cabecera. Por eso los
      # dos casos en que ese dato no esta o no se pudo leer NO salen en verde
      # mudo: si los artefactos existen y ninguno declara version (tipicamente
      # un CLI anterior al estampado de "generatedBy", la clase mas atrasada
      # posible) sale un ::warning; y si grep no pudo mirar, es rojo.
      - name: Artefactos regenerados al dia
        shell: bash
        env:
          PIN: ${{ inputs.version_openspec }}
        run: |
          set -euo pipefail

          DIRS=()
          if [ -d .claude ]; then DIRS+=(.claude); fi
          if [ -d .agents ]; then DIRS+=(.agents); fi
          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "este repo no tiene artefactos generados por el CLI: nada que verificar"
            exit 0
          fi

          # grep sale 1 cuando no encontro nada y >1 cuando NO PUDO MIRAR (un
          # artefacto ilegible, por ejemplo). El "|| true" los confundia: un
          # rc=2 dejaba declarados.txt vacio y el paso lo leia como "no hay
          # nada que verificar". Lo no verificable es rojo, nunca exito mudo.
          set +e
          grep -rn 'generatedBy:' "${DIRS[@]}" > declarados.txt
          RC=$?
          set -e
          if [ "${RC}" -gt 1 ]; then
            echo "::error::no se pudieron inspeccionar los artefactos generados (${DIRS[*]}, grep rc=${RC}) — sin poder leerlos, no se declara que esten al dia"
            exit 1
          fi

          if [ ! -s declarados.txt ]; then
            # Artefactos presentes y CERO declaraciones de version. Aviso y no
            # rojo porque el marco no puede exigir una cabecera que la version
            # vieja del CLI no emitia; pero callarse era declarar sano al repo
            # mas atrasado de todos, que es justo el incidente que motivo el
            # check.
            echo "::warning::hay artefactos del CLI en ${DIRS[*]} pero ninguno declara con que version se genero, asi que este check no puede afirmar que esten al dia (suele ser un CLI anterior al estampado de 'generatedBy'). Arreglo: regeneralos con npx --yes @fission-ai/openspec@${PIN} update --force"
            exit 0
          fi

          set +e
          grep -v "generatedBy: \"${PIN}\"" declarados.txt > divergentes.txt
          RC=$?
          set -e
          if [ "${RC}" -gt 1 ]; then
            echo "::error::no se pudieron comparar las versiones declaradas contra el pin (grep rc=${RC}) — sin poder mirar, no se declara que los artefactos esten al dia"
            exit 1
          fi

          if [ -s divergentes.txt ]; then
            # El mensaje trae el ARREGLO, no el diagnostico: un artefacto viejo
            # es un problema con solucion conocida, y obligar a redescubrirla
            # convierte el check en friccion en vez de en ayuda.
            echo "::error::hay artefactos generados por una version distinta al pin del marco (${PIN}). Regeneralos con: npx --yes @fission-ai/openspec@${PIN} update --force"
            echo "== artefactos divergentes =="
            cat divergentes.txt
            exit 1
          fi

          echo "$(wc -l < declarados.txt) artefactos declaran la version pineada (${PIN})"

      # HUECO 2 — las definiciones de pipeline eran el unico codigo del repo que
      # nadie linteaba. Un error de sintaxis o una expresion invalida se
      # descubrian EJECUTANDO, es decir despues del merge.
      #
      # shellcheck ya viene en el runner y actionlint lo detecta solo: cada
      # bloque "run:" pasa ademas por el. Eso importa mas de lo que parece en un
      # marco cuyos guardrails son, casi todos, bash dentro de YAML.
      # Los tres checks son independientes y CADA UNO tiene que reportar. Sin
      # esto, el primero en fallar deja a los otros dos en "skipped" y el repo
      # se entera de un solo problema por corrida: se arregla, vuelve a pushear,
      # y recien ahi descubre el siguiente. El descubrimiento vino de la
      # verificacion contra el consumidor real, no de leer el YAML.
      # !cancelled() y no always(): si alguien cancela la corrida, se para.
      - name: Definiciones de pipeline validas
        if: '!cancelled()'
        shell: bash
        env:
          VERSION_ACTIONLINT: ${{ inputs.version_actionlint }}
        run: |
          set -euo pipefail

          if [ ! -d .github/workflows ]; then
            echo "::error::el repo no tiene .github/workflows — el marco exige que el pipeline viva en el repo"
            exit 1
          fi

          TMP=$(mktemp -d)
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION_ACTIONLINT}"
          TAR="actionlint_${VERSION_ACTIONLINT}_linux_amd64.tar.gz"
          curl -fsSL -o "${TMP}/${TAR}" "${BASE}/${TAR}"
          curl -fsSL -o "${TMP}/checksums.txt" "${BASE}/actionlint_${VERSION_ACTIONLINT}_checksums.txt"
          # Verifica el asset contra los checksums del MISMO release: cubre
          # descarga corrupta o asset cambiado, no un release comprometido de
          # raiz. Se declara el alcance en vez de dar por sentado que "hay
          # checksum" significa "es seguro".
          ( cd "${TMP}" && sha256sum --check --ignore-missing checksums.txt )
          tar -xzf "${TMP}/${TAR}" -C "${TMP}" actionlint

          "${TMP}/actionlint" --version
          if ! "${TMP}/actionlint" -color; then
            echo "::error::las definiciones de pipeline no pasan la validacion (archivo y linea, arriba). Reproducilo local instalando actionlint ${VERSION_ACTIONLINT} y corriendolo en la raiz del repo"
            exit 1
          fi
          echo "definiciones de pipeline validas"

      # HUECO 3 — un marcador del scaffold que sobrevive al bootstrap falla en
      # SILENCIO. El caso que motiva el check: un placeholder sin sustituir en
      # el archivo de propietarios de codigo no produce error alguno, solo deja
      # de asignar revisores — y el review cruzado que el marco promete
      # desaparece sin ruido desde el primer dia del proyecto.
      #
      # Se verifica la AUSENCIA de marcadores, no la correccion de los valores
      # que los reemplazaron: comprobar que un handle existe o que una cuenta es
      # la del proyecto exige credenciales y contexto que CI no tiene, y su
      # falso positivo bloquearia integraciones legitimas.
      - name: Sin marcadores del scaffold sin resolver
        if: '!cancelled()'
        shell: bash
        run: |
          set -euo pipefail

          # Un repo que DISTRIBUYE un scaffold —el marco mismo— contiene los
          # marcadores a proposito: en la plantilla y en toda la documentacion
          # que la explica. Se detecta solo, por la presencia del scaffold, en
          # vez de por un input que un consumidor pueda apagar por descuido.
          # Consecuencia honesta: en el repo del marco este check no verifica
          # nada. Su valor esta entero del lado de los proyectos.
          if [ -f plantilla/.github/workflows/ci.yml ]; then
            echo "::notice::este repo distribuye un scaffold (plantilla/): los marcadores son su materia prima, no un bootstrap a medias — verificacion omitida"
            exit 0
          fi

          # {{MAYUSCULAS}} es la forma exacta que emite el scaffold. El [^$]
          # inicial descarta las expresiones que el proveedor de CI resuelve en
          # cada corrida (needs.build_test.result y companía), que ademas llevan
          # puntos y minusculas.
          # xargs colapsa "grep no encontro nada" (rc=1) y "grep no pudo leer"
          # (rc=2) en el mismo rc=123, asi que el codigo de salida no alcanza
          # para distinguirlos: el discriminante es lo que grep escribio en
          # stderr. Sin esto, un archivo rastreado ilegible dejaba pendientes.txt
          # vacio y el paso declaraba "sin marcadores" sobre una lectura que
          # nunca ocurrio.
          ERRORES="${RUNNER_TEMP}/marcadores-errores.txt"
          : > "${ERRORES}"

          git ls-files -z | xargs -0 grep -nIE '(^|[^$])\{\{[A-Z0-9_]+\}\}' > pendientes.txt 2>> "${ERRORES}" || true

          # El hueco de decision del scaffold. Se arma por codepoint (U+1F573)
          # en vez de pegar el emoji: asi matchea lo mismo lleve o no el
          # selector de variacion, y no depende del locale del runner.
          HUECO=$(printf '\xf0\x9f\x95\xb3')
          git ls-files -z | xargs -0 grep -nIF "${HUECO}" >> pendientes.txt 2>> "${ERRORES}" || true

          if [ -s pendientes.txt ]; then
            echo "::error::quedaron marcadores del scaffold sin resolver — el bootstrap del repo esta a medias y hay promesas del marco que no se estan cumpliendo (revisa sobre todo el archivo de propietarios de codigo)"
            echo "== marcadores pendientes =="
            cat pendientes.txt
          fi

          if [ -s "${ERRORES}" ]; then
            echo "::error::no se pudieron inspeccionar todos los archivos rastreados, asi que la AUSENCIA de marcadores del scaffold no se puede afirmar"
            echo "== lo que no se pudo leer =="
            cat "${ERRORES}"
          fi

          if [ -s pendientes.txt ] || [ -s "${ERRORES}" ]; then
            exit 1
          fi

          echo "sin marcadores del scaffold pendientes"

      # HUECO 4 — el marco EXIGE desde su primera version que los scripts de
      # verificacion declarados en los manifiestos propaguen su codigo de salida
      # real, y hasta hoy nada lo comprobaba: era un requirement del contrato
      # que nadie ejecutaba. Es la promesa mas barata de romper y la mas cara de
      # detectar — un script que termina en "|| true" convierte cualquier rojo
      # en verde y CI lo celebra. Por construccion, el enmascaramiento es
      # INVISIBLE para todo lo que dependa del codigo de salida (incluido este
      # pipeline), asi que la unica forma de atraparlo es LEER el script, no
      # ejecutarlo.
      #
      # La regla es sobre la FORMA DEL CUERPO, no sobre una lista de nombres de
      # script: un "lint", un "typecheck" y un "verificar-todo" que nadie
      # anticipo caen igual, y no queda ninguna lista que alguien tenga que
      # acordarse de actualizar cuando aparezca el nombre siguiente. Una lista
      # de nombres seria, otra vez, un guardrail que depende de la memoria.
      #
      # La propiedad que se evalua es: "el estado final del cuerpo NO es el del
      # comando de verificacion". Se resuelve leyendo el cuerpo como lo lee sh
      # —secuencia, lista and-or, pipeline— en vez de con un patron de sufijo:
      # el patron anterior solo cazaba "|| true", "|| :" y "exit 0" pegados al
      # final, y dejaba pasar por lo menos cinco formas equivalentes
      # ("|| echo", "; echo", "| tee", un comentario final que corre el ancla,
      # y "|| true && echo"), todas verificadas dando exit 0 con el comando
      # fallando.
      #
      # LIMITES DECLARADOS de la lectura (no de la ejecucion, que no ocurre):
      #   - Un pipe final a un comando que NO es pass-through ("| jq", "| grep")
      #     tambien reemplaza el estado y no se marca: decidir si ese comando
      #     puede fallar exige conocerlo.
      #   - Sustitucion de comandos y subshells se tratan como texto opaco.
      #   - Un "&" de fondo no se interpreta (partirlo rompe "2>&1").
      #   - El comentario final se descarta antes de leer; un "#" pegado al
      #     final de un argumento entrecomillado podria recortar de mas, y eso
      #     solo puede producir un falso POSITIVO, nunca un falso negativo.
      - name: Scripts de verificacion sin enmascaramiento
        if: '!cancelled()'
        shell: bash
        run: |
          set -euo pipefail

          # Node pelado, sin dependencias, como el resto de los guardrails. Si
          # no esta, no se puede verificar — y lo que no se puede verificar es
          # rojo, nunca un exito mudo.
          if ! command -v node > /dev/null 2>&1; then
            echo "::error::no hay 'node' en el PATH y sin el no se pueden leer los manifiestos. Arreglo: agrega 'uses: actions/setup-node@v7' a este job, antes de este paso"
            exit 1
          fi

          # Solo lo RASTREADO: un manifiesto sin versionar no es contrato de
          # nadie, y node_modules queda afuera por construccion en vez de por
          # una exclusion que haya que mantener a mano. core.quotePath=false
          # para que una ruta con acentos salga tal cual y no escapada en
          # octal: escapada, el paso siguiente no la encontraria y la reportaria
          # como manifiesto ilegible (rojo, pero por el motivo equivocado).
          git -c core.quotePath=false ls-files -- '*package.json' > "${RUNNER_TEMP}/manifiestos.txt"

          # El script va inline y no en un archivo aparte: un heredoc no puede
          # cerrar dentro de un bloque de YAML indentado —su terminador tendria
          # que ir en la columna 0, y ahi termina el bloque—.
          node -e '
            const { readFileSync } = require("node:fs");

            // Comandos que salen 0 pase lo que pase, en cualquier posicion.
            const SIEMPRE_CERO = /^(true|:|exit[ \t]+0|echo|printf)([ \t]|$)/;

            // Pass-through: consumen la entrada y salen 0. Solo cuentan cuando
            // RECIBEN un pipe, que es donde reemplazan el estado del comando
            // de la izquierda; sueltos ("cat archivo") si pueden fallar.
            const PASA_A_TRAVES = /^(tee|cat|head|tail)([ \t]|$)/;

            // Corta el cuerpo en [comando, separador, comando, ...] de nivel
            // superior, respetando comillas y descartando el comentario final.
            // Un "&" suelto NO es separador: partiria "2>&1" al medio.
            function tokenizar(cuerpo) {
              const partes = [];
              let actual = "";
              let comilla = null;
              for (let i = 0; i < cuerpo.length; i += 1) {
                const c = cuerpo[i];
                if (comilla !== null) {
                  actual += c;
                  if (c === comilla) comilla = null;
                  continue;
                }
                // La comilla simple va como \u0027 y no literal: el programa
                // entero viaja dentro de comillas simples de shell.
                if (c === "\"" || c === "\u0027") { comilla = c; actual += c; continue; }
                if (c === "\\") { actual += c + (cuerpo[i + 1] || ""); i += 1; continue; }
                if (c === "#" && (actual === "" || /[ \t]$/.test(actual))) break;
                const dos = cuerpo.slice(i, i + 2);
                if (dos === "||" || dos === "&&") { partes.push(actual, dos); actual = ""; i += 1; continue; }
                if (c === ";" || c === "|") { partes.push(actual, c); actual = ""; continue; }
                actual += c;
              }
              partes.push(actual);
              return partes;
            }

            // Agrupa la lista plana por los separadores dados, devolviendo
            // [grupo, separador, grupo, ...]. Los separadores que no estan en
            // la lista quedan dentro de su grupo.
            function agrupar(partes, separadores) {
              const grupos = [];
              let actual = [partes[0]];
              for (let i = 1; i < partes.length; i += 2) {
                if (separadores.indexOf(partes[i]) >= 0) {
                  grupos.push(actual, partes[i]);
                  actual = [partes[i + 1]];
                } else {
                  actual.push(partes[i], partes[i + 1]);
                }
              }
              grupos.push(actual);
              return grupos;
            }

            // El estado de un pipeline es el de su ULTIMO comando.
            function pipelineSiempreCero(grupo) {
              const ultimo = grupo[grupo.length - 1].trim();
              const recibePipe = grupo.length > 1;
              return SIEMPRE_CERO.test(ultimo) || (recibePipe && PASA_A_TRAVES.test(ultimo));
            }

            // Lee el cuerpo como lo lee sh: ";" separa una secuencia y el
            // estado es el del ultimo elemento; dentro, "&&" y "||" arman una
            // lista asociativa por izquierda donde
            //   A || B sale 0 si A sale 0 O si B sale 0
            //   A && B sale 0 solo si los DOS salen 0
            function siempreCero(partes) {
              const secuencia = agrupar(partes, [";"]);
              const lista = agrupar(secuencia[secuencia.length - 1], ["||", "&&"]);
              let estado = pipelineSiempreCero(lista[0]);
              for (let i = 1; i < lista.length; i += 2) {
                const derecha = pipelineSiempreCero(lista[i + 1]);
                estado = lista[i] === "||" ? (estado || derecha) : (estado && derecha);
              }
              return estado;
            }

            // Sin un comando que pueda fallar no hay nada que tapar: un
            // "prepare": "true" o un "saludo": "echo a && echo b" salen 0 por
            // naturaleza y no enmascaran nada.
            function hayComandoQuePuedeFallar(partes) {
              for (let i = 0; i < partes.length; i += 2) {
                const comando = partes[i].trim();
                if (comando === "") continue;
                if (SIEMPRE_CERO.test(comando) || PASA_A_TRAVES.test(comando)) continue;
                return true;
              }
              return false;
            }

            // El cuerpo sin la cola que enmascara: se sacan pares (separador,
            // comando) del final hasta que el estado vuelve a ser el del
            // comando de verificacion. Eso es el arreglo, listo para pegar.
            function sinLaCola(partes) {
              let restante = partes.slice();
              while (restante.length > 1 && siempreCero(restante)) {
                restante = restante.slice(0, -2);
              }
              return restante.join("");
            }

            // Un comando de workflow termina en el salto de linea y trata "%"
            // como escape: sin normalizar, un script con "%" adentro mutila su
            // propio mensaje de error.
            const escapar = (valor) =>
              String(valor).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");

            // Linea de la declaracion dentro del bloque "scripts".
            // Aproximacion honesta: en un manifiesto normal da la linea exacta
            // y en el peor caso la anotacion cae unas lineas mas arriba.
            // Parsear JSON conservando posiciones costaria una dependencia,
            // que es justo lo que el marco no se permite.
            function lineaDeclaracion(texto, nombre) {
              const lineas = texto.split(/\r?\n/);
              const clave = "\"" + nombre + "\"";
              let inicio = lineas.findIndex((linea) => linea.includes("\"scripts\""));
              if (inicio < 0) inicio = 0;
              for (let i = inicio; i < lineas.length; i += 1) {
                if (lineas[i].includes(clave)) return i + 1;
              }
              return inicio + 1;
            }

            const manifiestos = readFileSync(process.argv[1], "utf8").split(/\r?\n/).filter(Boolean);

            if (manifiestos.length === 0) {
              // "No hay datos" no se reporta como exito mudo: se dice en voz
              // alta. Projects cae justo aca (no tiene manifiestos propios) igual
              // que en el check de marcadores, y el dia que tenga uno el check
              // se enciende solo.
              console.log("::notice::no hay ningun package.json rastreado: no hay scripts que puedan enmascarar un fallo — verificacion omitida");
              process.exit(0);
            }

            const hallazgos = [];
            const ilegibles = [];
            let revisados = 0;

            for (const ruta of manifiestos) {
              let texto;
              let manifiesto;
              try {
                texto = readFileSync(ruta, "utf8");
                manifiesto = JSON.parse(texto);
              } catch (error) {
                ilegibles.push({ ruta, detalle: error.message });
                continue;
              }

              const scripts = manifiesto && manifiesto.scripts;
              if (!scripts || typeof scripts !== "object") continue;

              for (const [nombre, cuerpo] of Object.entries(scripts)) {
                if (typeof cuerpo !== "string") continue;
                revisados += 1;
                const partes = tokenizar(cuerpo.trim());
                // Un solo comando: su estado ES el del cuerpo, nada que tapar.
                if (partes.length === 1) continue;
                if (!siempreCero(partes)) continue;
                if (!hayComandoQuePuedeFallar(partes)) continue;
                const completo = partes.join("");
                const arreglado = sinLaCola(partes);
                hallazgos.push({
                  ruta: ruta,
                  nombre: nombre,
                  linea: lineaDeclaracion(texto, nombre),
                  sufijo: completo.slice(arreglado.length).trim(),
                  arreglado: arreglado.trim(),
                });
              }
            }

            for (const item of ilegibles) {
              // No se pudo leer = no se pudo verificar. Rojo, jamas silencio.
              console.log("::error file=" + escapar(item.ruta) + "::no se pudo leer el manifiesto (" + escapar(item.detalle) + "), asi que no se puede afirmar que sus scripts propaguen su codigo de salida. Arreglo: corregi el JSON de " + escapar(item.ruta) + " hasta que parsee");
            }

            for (const hallazgo of hallazgos) {
              // El mensaje trae el ARREGLO, no el diagnostico: el cuerpo ya
              // viene escrito sin el sufijo, listo para pegar en el manifiesto.
              console.log("::error file=" + escapar(hallazgo.ruta) + ",line=" + hallazgo.linea + "::el script \"" + escapar(hallazgo.nombre) + "\" termina en \"" + escapar(hallazgo.sufijo) + "\" y con ese sufijo un fallo llega a CI como exito. Arreglo: en " + escapar(hallazgo.ruta) + " deja el cuerpo en \"" + escapar(hallazgo.arreglado) + "\". Si ese comando TIENE que poder fallar sin detener la integracion, eso se decide en el paso que lo invoca (continue-on-error), no escondiendo su codigo de salida dentro del script");
            }

            if (hallazgos.length > 0 || ilegibles.length > 0) {
              console.log("== resumen == " + hallazgos.length + " script(s) enmascarando su fallo y " + ilegibles.length + " manifiesto(s) ilegible(s), sobre " + manifiestos.length + " manifiesto(s) rastreado(s)");
              process.exit(1);
            }

            // La verdad de lo que se probo, ni una palabra mas. Este paso LEE
            // el texto del cuerpo, no ejecuta nada: no puede afirmar que los
            // scripts propaguen su codigo de salida, solo que ninguno cae en
            // las formas de enmascaramiento que sabe reconocer. Decirlo de
            // mas convertia el check en la fuente de la falsa tranquilidad que
            // vino a eliminar.
            console.log(revisados + " script(s) de " + manifiestos.length + " manifiesto(s) leidos: ninguno cae en una forma de enmascaramiento conocida (una secuencia, lista and-or o pipeline cuyo estado final sale 0 pase lo que pase). Es lectura de forma y no ejecucion: NO prueba que el codigo de salida se propague");
          ' "${RUNNER_TEMP}/manifiestos.txt"

      # HUECO 5 — el censo de fuentes (la derivacion que le pregunta a cada
      # herramienta que archivos mira de verdad) NO puede correr en este job:
      # necesita las dependencias del consumidor ya instaladas para interrogar
      # a su toolchain, asi que vive en el job del propio proyecto. Eso abre un
      # hueco que si es de aca: un repo puede tener el contrato escrito y no
      # invocar el paso en ningun flujo, y entonces un archivo que ninguna
      # herramienta mira no produce rojo en ningun lado. El repo que DECLARA la
      # verificacion pero no la EJECUTA es rojo, y esa es la unica parte del
      # alcance que se puede comprobar estaticamente desde el marco.
      #
      # El grep es exacto y ANCLADO, no heuristico, y puede serlo porque GitHub
      # PROHIBE expresiones en el campo "uses": la referencia a una action es
      # siempre literal, nunca calculada — el propio marco lo tiene documentado
      # en el job de openspec. El ancla ^\s*(- )?uses: descarta las lineas
      # comentadas, que son la forma mas facil de "cablear" algo sin cablearlo.
      #
      # Se busca el SEGMENTO DE RUTA de la action y no "@v1": la validacion
      # contra un consumidor real exige apuntar a la rama del change antes de
      # que el tag movil se mueva, y un grep atado a @v1 declararia "sin
      # cablear" justo la corrida que prueba el cableado.
      - name: Censo de fuentes cableado
        if: '!cancelled()'
        shell: bash
        run: |
          set -euo pipefail

          # SKIP POR PROPIEDAD, no por input. El censo interroga al toolchain
          # de un repo de Node; sin NINGUN manifiesto no hay toolchain que
          # interrogar. Projects cae justo aca —igual que en el check de
          # marcadores— y el dia que tenga su propio manifiesto el check se
          # enciende SOLO, sin que nadie se acuerde de encenderlo. Un input
          # seria una perilla que un consumidor puede apagar por descuido.
          #
          # QUE CUENTA COMO "repo de Node" PARA ESTE PASO, y por que NO es el
          # mismo pathspec que el del paso de enmascaramiento.
          #
          # Aca la pregunta es "este REPOSITORIO es un proyecto de Node que
          # tiene que censar sus fuentes?", y eso lo contesta el manifiesto de
          # la RAIZ (o el del workspace). Alla la pregunta es otra: "que
          # manifiestos existen, para leerles los scripts?", y ahi si hay que
          # barrer todos. Dos preguntas distintas, dos pathspecs distintos: no
          # es una inconsistencia, es que no preguntan lo mismo.
          #
          # Se probo con '*package.json' y el resultado fue exactamente el
          # error que esa distincion evita: los package.json de los FIXTURES de
          # prueba de este repo lo convertian en "repo de Node", Projects dejaba
          # de tomar el skip y el paso le exigia cablear el censo en sus
          # propios workflows. Un archivo de prueba no hace de un repo un
          # proyecto de Node.
          #
          # Se incluye pnpm-workspace.yaml por el caso que motivo la revision:
          # un monorepo cuyo codigo vive todo en subdirectorios. Con pnpm ese
          # caso igual exige manifiesto en la raiz, asi que es cinturon y
          # tirantes, no redundancia inutil.
          if [ -z "$(git ls-files -- package.json pnpm-workspace.yaml)" ]; then
            echo "::notice::este repo no versiona un manifiesto de Node en la raiz: no hay toolchain que censar — verificacion omitida"
            exit 0
          fi

          if [ ! -d .github/workflows ]; then
            echo "::error::el repo no tiene .github/workflows — no hay donde cablear el censo de fuentes"
            exit 1
          fi

          # La identidad estable de la pieza dentro del "uses":
          #   <org>/<repo>/actions/<nombre>@<ref>
          ACTION="actions/censo-fuentes"
          PATRON='^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]]*'"${ACTION}"'([^A-Za-z0-9_-]|$)'

          # --include acota la busqueda a lo que GitHub EJECUTA. Sin el, el
          # recorrido barria tambien la documentacion del directorio, y un
          # README con el snippet pegado —el mismo snippet que el rojo de mas
          # abajo imprime para copiar— alcanzaba para declarar "cableado" un
          # censo que nunca se invoco: el mensaje de error ensenaba a evadirlo.
          CABLEADO="${RUNNER_TEMP}/cableado.txt"
          set +e
          grep -rnE --include='*.yml' --include='*.yaml' "${PATRON}" .github/workflows > "${CABLEADO}"
          RC=$?
          set -e
          if [ "${RC}" -gt 1 ]; then
            # grep devuelve >1 solo por error real. No se pudo mirar, asi que
            # no se declara verde: lo no verificable es rojo.
            echo "::error::no se pudo inspeccionar .github/workflows (grep rc=${RC}) — sin poder mirar, el cableado del censo no se da por bueno"
            exit 1
          fi

          if [ ! -s "${CABLEADO}" ]; then
            echo "::error::este repo no invoca el censo de fuentes en ningun flujo: sin ese paso, un archivo que ninguna herramienta mira no produce rojo en ningun lado y la verificacion de alcance queda declarada pero apagada. Arreglo: pega el paso de abajo en el job que ya corre lint y typecheck, DESPUES de instalar dependencias (el censo interroga al toolchain ya instalado)"
            echo "== paso a agregar =="
            echo "      - name: Ningun archivo fuera del alcance de la verificacion"
            echo "        uses: im-diego-ec/Projects/actions/censo-fuentes@v1"
            exit 1
          fi

          echo "== cableado del censo de fuentes =="
          cat "${CABLEADO}"

          # Aviso, no rojo: un continue-on-error en el mismo archivo NO prueba
          # que aplique al paso del censo, y enrojecer por eso bloquearia
          # integraciones legitimas. Se avisa porque el limite ya esta declarado
          # en el design ("cableado vivo pero paso inofensivo") y un limite que
          # no se dice en la corrida es un limite que nadie recuerda.
          ARCHIVOS="${RUNNER_TEMP}/archivos-cableado.txt"
          cut -d: -f1 "${CABLEADO}" | sort -u > "${ARCHIVOS}"
          while IFS= read -r ARCHIVO; do
            if grep -qE '^[[:space:]]*(-[[:space:]]+)?continue-on-error:' "${ARCHIVO}"; then
              echo "::warning file=${ARCHIVO}::${ARCHIVO} cablea el censo de fuentes y ademas usa continue-on-error: si ese modificador cae sobre el paso del censo, su rojo no detiene nada y el cableado queda vivo pero inofensivo. Verifica a que paso aplica"
            fi
          done < "${ARCHIVOS}"

          echo "el censo de fuentes esta cableado"

      # HUECO 5 — el umbral del total del marco vivia en UN solo lugar (la
      # constante del comparador de cobertura) y el andamio no lo repartia, asi
      # que cada proyecto nuevo se inventaba el numero. El que se inventa
      # termina siendo el que la medicion daba ese dia: el consumidor llego a
      # tener functions: 70.6 fijado en su propio valor medido, o sea un umbral
      # cumplido por construccion. Ahora el andamio lo trae, y como eso son DOS
      # copias del mismo numero en dos archivos, este check las compara. Dos
      # numeros que tienen que coincidir y que nadie compara son un numero que
      # va a divergir.
      #
      # Solo aplica al repo que DISTRIBUYE el andamio (Projects). En un consumidor
      # no hay plantilla/ que comparar, y el paso lo dice en vez de callarse.
      - name: El andamio reparte el umbral del total del marco
        if: '!cancelled()'
        shell: bash
        run: |
          set -euo pipefail

          COMPARADOR="actions/cobertura-diff/medir-cobertura-diff.mjs"
          BASE_VITEST="plantilla/vitest.config.base.mjs"

          if [ ! -f "${COMPARADOR}" ]; then
            echo "::notice::este repo no distribuye el comparador de cobertura del marco: no hay umbral que comparar — verificacion omitida"
            exit 0
          fi

          # El [[:space:]]* del final absorbe el retorno de carro: en un
          # checkout de Windows sin .gitattributes el archivo llega en CRLF y un
          # ancla al ";$" pelado no matchea nunca. Ahi el check se caeria por un
          # motivo que no es el suyo.
          DEL_MARCO="$(sed -n 's/^const MINIMO_DEL_MARCO = \([0-9][0-9]*\);[[:space:]]*$/\1/p' "${COMPARADOR}" | head -n 1)"
          if [ -z "${DEL_MARCO}" ]; then
            echo "::error::no se pudo leer MINIMO_DEL_MARCO de ${COMPARADOR}. Si la constante se renombro o cambio de forma, actualiza este check en el mismo PR: un check que no puede leer el numero no puede declarar que coincide con nada"
            exit 1
          fi
          echo "minimo del marco, segun el comparador: ${DEL_MARCO}"

          if [ ! -f "plantilla/.github/workflows/ci.yml" ]; then
            echo "::notice::este repo no distribuye un andamio (plantilla/): el umbral del total se lo reparte el marco, no este repo — verificacion omitida"
            exit 0
          fi

          if [ ! -f "${BASE_VITEST}" ]; then
            echo "::error::el andamio no reparte ninguna configuracion de cobertura del total: falta ${BASE_VITEST}. Sin eso cada proyecto nuevo inventa su umbral, y el que se inventa es el que la medicion dio ese dia: un umbral cumplido por construccion. Arreglo: agregar ${BASE_VITEST} con thresholds en ${DEL_MARCO} para lines, functions, branches y statements"
            exit 1
          fi

          DEL_ANDAMIO="$(sed -n 's/^export const MINIMO_DEL_MARCO = \([0-9][0-9]*\);[[:space:]]*$/\1/p' "${BASE_VITEST}" | head -n 1)"
          if [ -z "${DEL_ANDAMIO}" ]; then
            echo "::error::${BASE_VITEST} no declara MINIMO_DEL_MARCO de forma legible, asi que no se puede comprobar que reparta el mismo numero que el comparador. Arreglo: dejalo como 'export const MINIMO_DEL_MARCO = ${DEL_MARCO};'"
            exit 1
          fi

          if [ "${DEL_ANDAMIO}" != "${DEL_MARCO}" ]; then
            echo "::error file=${BASE_VITEST}::el andamio reparte un umbral de total de ${DEL_ANDAMIO}% y el comparador del marco exige ${DEL_MARCO}%: un proyecto creado hoy nace con su suite local pidiendo un numero y la integracion pidiendo otro. Arreglo: dejar los dos en el mismo valor, cambiados en el mismo PR"
            exit 1
          fi

          # Las cuatro metricas y all:true. Sin all:true el reporte solo trae
          # los archivos que alguna prueba importo y el total sube por omision:
          # el umbral quedaria puesto sin medir el codigo que a nadie molesta.
          FALTAN=()
          for CLAVE in "lines: minimo" "functions: minimo" "branches: minimo" "statements: minimo" "all: true"; do
            if ! grep -qF "${CLAVE}" "${BASE_VITEST}"; then FALTAN+=("${CLAVE}"); fi
          done
          if [ ${#FALTAN[@]} -gt 0 ]; then
            echo "::error file=${BASE_VITEST}::a la configuracion de cobertura del andamio le falta: ${FALTAN[*]}. Las cuatro metricas y all:true son lo que hace que el umbral mida algo"
            exit 1
          fi

          echo "el andamio reparte el umbral del total (${DEL_ANDAMIO}%) y coincide con el del comparador"

  # Veredicto agregado DEL MARCO. Reporta siempre (docs o codigo). No conoce el
  # build/test del producto: ese lo agrega el ci-ok del repo consumidor, que es
  # el check requerido por el ruleset.
  marco_ok:
    name: marco-ok
    needs: [cambios, openspec, higiene]
    if: always()
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Veredicto
        shell: bash
        run: |
          [ "${{ needs.cambios.result }}" = "success" ] || { echo "::error::la deteccion de cambios fallo"; exit 1; }
          [ "${{ needs.openspec.result }}" = "success" ] || { echo "::error::la validacion de OpenSpec fallo"; exit 1; }
          [ "${{ needs.higiene.result }}" = "success" ] || { echo "::error::los checks de higiene del marco fallaron"; exit 1; }
          if [ "${{ needs.cambios.outputs.solo_docs }}" = "true" ]; then
            echo "carril de docs: el consumidor puede omitir su build/test"
          else
            echo "carril completo: el consumidor debe correr su build/test"
          fi
          if [ "${{ needs.cambios.outputs.confiable }}" != "true" ]; then
            echo "::warning::la deteccion del carril cayo al fail-open — el veredicto es valido, pero el carril rapido no actuo"
          fi
