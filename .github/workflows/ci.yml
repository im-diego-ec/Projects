name: CI

# CI del propio Projects — dogfooding. El marco corre sobre si mismo: valida sus
# specs de OpenSpec con el mismo workflow reusable que exporta a los proyectos
# (marco-ci.yml), asi un cambio que rompa el marco se cae aca antes de llegar a
# {{PROYECTO}}.
#
# Projects no sirve nada en runtime (no hay web ni api), asi que NO hay build/test
# de producto: el carril de docs es practicamente el unico carril. Aun asi la
# forma del CI es la misma que la del scaffold — un job "marco" y un veredicto
# "ci-ok" — para que lo que se prueba aca sea lo que se reparte.
#
# Se llama al workflow reusable por ruta LOCAL (./.github/workflows/marco-ci.yml)
# a proposito: asi cada PR se valida contra la version del marco que ESE PR
# propone, no contra la etiqueta @v1 ya publicada.
#
# DOS SUPERFICIES, DOS EXIGENCIAS DE SISTEMA OPERATIVO. Casi todo lo que el marco
# hace ocurre en un runner, y ahi el marco elige el suyo: Linux x86-64, declarado
# en el input `runner` de marco-ci.yml y comprobado por el primer paso de higiene.
# Pero `herramientas/projects-init.mjs` NO corre en un runner: corre en la maquina
# de quien inicia un proyecto, que puede ser Windows, macOS o Linux. Por eso el
# unico job con matriz de sistemas operativos en este archivo es `pruebas-init`
# (los tres), y por eso el resto sigue en ubuntu-latest: una matriz que no
# corresponde a una superficie real se paga en minutos y no compra evidencia.
on:
  push:
    branches: [main]
  pull_request:

# OBLIGATORIO y no decorativo: un workflow reusable nunca puede pedir mas
# permisos que los que le concede quien lo llama. Sin pull-requests:read, el
# job "cambios" no puede listar los archivos del PR, cae al fail-open y el
# carril rapido no actua nunca (incidente del 2026-08-05).
permissions:
  contents: read
  pull-requests: read

jobs:
  marco:
    uses: ./.github/workflows/marco-ci.yml
    # Sin "with": el CI del marco corre con los defaults que exporta, que es
    # justamente lo que hay que probar. Si un default no sirve para Projects,
    # tampoco sirve para los proyectos — se arregla el default, no este bloque.

  # Banco de pruebas de las composite actions del marco.
  #
  # POR QUE ES UN JOB PROPIO Y NO UNA BUENA PRACTICA. El marco NO puede
  # dogfoodear los checks que interrogan manifiestos de paquete: Projects no tiene
  # ninguno, asi que sobre este repo el censo de fuentes no verifica nada (el
  # mismo limite declarado que el check de marcadores del scaffold). La
  # diferencia es que estas piezas traen codigo no trivial, y su unica evidencia
  # posible son los casos sinteticos de aca mas la validacion contra un
  # consumidor real. Sin este job, ese codigo llega a todos los consumidores sin
  # que nada lo pruebe.
  #
  # El job lleva ademas el banco de los pasos INLINE de marco-ci.yml (segundo
  # paso de "casos sinteticos"): el nombre quedo por las actions, que fueron lo
  # primero que tuvo banco, pero lo que agrupa es "todo el codigo del marco que
  # se prueba con casos controlados".
  pruebas_actions:
    name: pruebas-actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      # Que actions quedan SIN banco, derivado del arbol y no de una lista que
      # alguien tenga que acordarse de actualizar: toda action que traiga su
      # propio script .mjs deberia traer sus pruebas al lado. Hoy no puede ser
      # rojo (guardrail-deltas es anterior a esta regla y su puesta al dia es
      # otro change), pero tampoco puede pasar mudo — un fail-open silencioso es
      # justamente lo que el marco prohibe.
      - name: Que actions quedan sin banco de pruebas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          SIN_BANCO=()
          for ACCION in actions/*/; do
            SCRIPTS=("${ACCION}"*.mjs)
            if [ ${#SCRIPTS[@]} -eq 0 ]; then
              continue
            fi
            BANCO=("${ACCION}pruebas/"*.test.mjs)
            if [ ${#BANCO[@]} -eq 0 ]; then
              SIN_BANCO+=("${ACCION%/}")
            fi
          done

          if [ ${#SIN_BANCO[@]} -gt 0 ]; then
            echo "::warning::estas actions traen script propio y ningun banco de pruebas: ${SIN_BANCO[*]}. Su codigo llega a todos los consumidores de @v1 sin haberse ejecutado nunca sobre un caso controlado. Arreglo: agregar <action>/pruebas/<nombre>.test.mjs, que el paso siguiente recoge solo"
          else
            echo "toda action con script propio trae su banco de pruebas"
          fi

      # node --test es el runner que trae Node 22: cero dependencias, igual que
      # el resto del marco. Los archivos se pasan uno por uno a proposito:
      # `node --test <directorio>` no resuelve el patron en las versiones nuevas
      # de Node y el job quedaria rojo por una razon que no es la suya.
      - name: Casos sinteticos de las composite actions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          PRUEBAS=(actions/**/pruebas/*.test.mjs)

          # "No encontre pruebas" JAMAS se reporta como exito: un renombrado de
          # carpeta, un glob que deja de matchear o un checkout parcial dejarian
          # este job en verde sin haber ejecutado una sola asercion, que es
          # exactamente el fail-open mudo que el marco prohibe.
          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo de pruebas en actions/**/pruebas/*.test.mjs. Si moviste el banco de pruebas, actualiza este patron; si lo borraste, el codigo de las actions quedo sin cobertura"
            exit 1
          fi

          echo "== bancos de pruebas encontrados (node $(node --version)) =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

      # Banco de los pasos INLINE de marco-ci.yml.
      #
      # POR QUE ES UN PASO APARTE Y POR QUE HACIA FALTA. Los guardrails que
      # viven dentro de un bloque "run:" no pueden salir de ahi: marco-ci.yml es
      # un workflow reusable, asi que cuando lo llama un consumidor el arbol
      # checkouteado es el DEL CONSUMIDOR y ningun archivo de Projects esta
      # presente. Por eso ese codigo va inline, y por eso era el unico codigo del
      # marco sin una sola asercion. La auditoria del 2026-08-20 lo anoto como
      # hueco justo despues de medir, en esos mismos pasos, cuatro defectos que
      # salian en VERDE —uno de ellos en el detector de secretos— y una rama de
      # aviso que era codigo muerto.
      #
      # El banco no copia ese codigo (una copia se desincroniza y miente): lee
      # marco-ci.yml, extrae el script exacto del paso y lo corre contra
      # fixtures. Si un paso se renombra o pierde su "run:", el extractor tira y
      # esto se pone rojo en vez de dejar de probar en silencio.
      - name: Casos sinteticos de los pasos inline de marco-ci
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          TODAS=(pruebas/**/*.test.mjs)

          # Misma disciplina que el paso de arriba: "no encontre pruebas" jamas
          # se reporta como exito.
          if [ ${#TODAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo de pruebas en pruebas/**/*.test.mjs. Si moviste el banco de los pasos inline, actualiza este patron; si lo borraste, esos pasos volvieron a no tener ninguna asercion"
            exit 1
          fi

          # pruebas/init/ SE EXCLUYE ACA PORQUE CORRE EN OTRO LADO, no porque se
          # haya apagado: es el unico banco del marco cuyo sujeto no vive en un
          # runner sino en la maquina del desarrollador, asi que lo corre el job
          # `pruebas-init` sobre los tres sistemas operativos. Ejecutarlo tambien
          # aca solo repetiria la pasada de Linux.
          #
          # La exclusion no puede quedar apuntando al vacio: si alguien mueve o
          # borra pruebas/init/, esta condicion se pone roja en vez de dejar de
          # excluir en silencio. (El job `pruebas-init` tambien se pondria rojo;
          # esto lo dice desde el lado que hace la exclusion, que es donde se lee
          # el motivo.)
          INIT=(pruebas/init/*.test.mjs)
          if [ ${#INIT[@]} -eq 0 ]; then
            echo "::error::este paso excluye pruebas/init/ porque el job 'pruebas-init' lo corre sobre ubuntu, windows y macos, pero pruebas/init/ no tiene ningun *.test.mjs. Si moviste ese banco, mueve tambien la exclusion y la matriz; si lo borraste, la herramienta de init se quedo sin la unica prueba que la ejercita fuera de Linux"
            exit 1
          fi

          PRUEBAS=()
          for P in "${TODAS[@]}"; do
            case "${P}" in
              pruebas/init/*) continue ;;
            esac
            PRUEBAS+=("${P}")
          done

          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::despues de excluir pruebas/init/ no quedo ningun banco que correr aca. O el resto de pruebas/ desaparecio, o todo se movio dentro de init/"
            exit 1
          fi

          echo "== bancos de los pasos inline encontrados (sin pruebas/init/, que corre en la matriz) =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

  # LA HERRAMIENTA DE INIT, EN LOS TRES SISTEMAS OPERATIVOS.
  #
  # POR QUE ES UN JOB APARTE Y CON MATRIZ. `herramientas/projects-init.mjs` es la
  # unica pieza del marco que NO se ejecuta en un runner: se ejecuta en la maquina
  # de quien clona el marco para arrancar un proyecto, y esa maquina es Windows,
  # macOS o Linux segun quien sea. Hasta hoy su banco solo se habia ejecutado en
  # ubuntu-latest, dentro del job de arriba: o sea que el marco pedia que la
  # herramienta sirviera en las tres y solo tenia evidencia de una.
  #
  # POR QUE LA MATRIZ NO VA EN TODO EL CI. Porque el resto del marco corre en un
  # runner y ahi el marco ELIGE la plataforma —Linux x86-64, declarado en el input
  # `runner` de marco-ci.yml—. Multiplicar por tres jobs cuya plataforma esta
  # fijada por contrato cuesta minutos y no compra una sola asercion nueva.
  #
  # fail-fast: false a proposito: si init se rompe en Windows, querer saber ademas
  # si se rompe en macOS es la mitad del diagnostico, y cancelar las otras dos
  # patas lo esconde.
  #
  # QUE HACE FALTA PARA QUE ESTO SIRVA DE VERDAD, y esta cuidado: el paso corre
  # con `shell: bash` (en windows-latest eso es el bash de Git, que viene en el
  # runner), el patron es de UN solo nivel (`pruebas/init/*.test.mjs`) para no
  # depender de `globstar`, que el bash 3.2 de macOS no tiene, y las rutas van con
  # barra normal, que Git Bash entiende. El banco en si ya es portable: usa
  # node:path, os.tmpdir() y process.execPath en vez de rutas cableadas, y la
  # herramienta trae su rama de Windows: el `openspec init` que lanza npx le pasa
  # `shell: process.platform === "win32"` a execFileSync, en
  # herramientas/projects-init.mjs. VA SIN NUMERO DE LINEA A PROPOSITO: ese
  # archivo se edita seguido y el puntero se pudre —esta misma nota ya cito una
  # linea equivocada una vez—. El ancla es `grep -n win32
  # herramientas/projects-init.mjs`, que devuelve la llamada y el parrafo del
  # encabezado que explica por que esa rama existe.
  # El .gitattributes del repo fija `* text=auto eol=lf`, asi que el checkout de
  # Windows no rematerializa CRLF y las comparaciones byte a byte del banco
  # siguen valiendo.
  pruebas_init:
    name: pruebas-init (${{ matrix.so }})
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.so }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      - name: Banco de la herramienta de init
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          PRUEBAS=(pruebas/init/*.test.mjs)

          # Misma disciplina que los demas bancos: "no encontre pruebas" jamas se
          # reporta como exito. Aca ademas la matriz lo multiplica — un patron
          # que deja de matchear daria TRES verdes sin una sola asercion.
          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo en pruebas/init/*.test.mjs. Si moviste el banco de la herramienta de init, actualiza este patron y la exclusion del job pruebas-actions; si lo borraste, la herramienta que corre en la maquina de la gente se quedo sin banco en los tres sistemas operativos"
            exit 1
          fi

          echo "== banco de init en $(uname -s) ($(uname -m)), node $(node --version) =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

  # PINES DE ACTIONS DE TERCEROS: LA FRONTERA QUE EL MARCO DECLARA Y NADIE MEDIA.
  #
  # Se llama `higiene` por el job del mismo nombre de marco-ci.yml, del que es
  # hermano en intencion —lo que el marco AFIRMA y hasta hoy nadie verificaba—,
  # pero vive aca y no alla por una razon concreta: cuando marco-ci.yml corre en
  # un consumidor, el arbol checkouteado es el DEL CONSUMIDOR, asi que un check
  # alojado ahi auditaria los pines ajenos... del consumidor, no los del marco.
  # Los pines que este paso mira son los que el marco EJECUTA y los que REPARTE.
  higiene:
    name: higiene-del-marco
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # AGENTS.md:257 declara la frontera textual: "Agregar una dependencia o una
      # action de terceros al marco: entra al pipeline de todos los consumidores.
      # Se pina por SHA, no por tag movil ajeno." Nada la verificaba.
      #
      # POR QUE IMPORTA MAS QUE UN PIN CUALQUIERA. Es la unica clase de cambio que
      # llega a todos los consumidores a la vez sin que nadie mergee nada: mover un
      # tag ajeno no abre un PR, no produce diff y no dispara aviso. La asimetria
      # lo dice sola — la unica action de terceros que el repo trata como tal
      # (anthropics/claude-code-action, .github/workflows/claude.yml:178) esta
      # pinada por SHA con su comentario `# v1.0.196` al lado, y las de GitHub,
      # que corren en cada job de cada repo, no.
      #
      # ESTADO MEDIDO EL 2026-08-24, ya contando los tres uses: que agrega este
      # mismo cambio (26 de 28 uses ajenos van por tag movil):
      #     15  actions/checkout@v7
      #     10  actions/setup-node@v7
      #      1  actions/upload-artifact@v5
      # De esos 26, DIEZ viajan: 8 en plantilla/.github/workflows/ (que el andamio
      # copia a cada proyecto nuevo) y 2 en los action.yml de cobertura-diff y
      # guardrail-deltas (que ejecuta cada consumidor de @v1). Los otros 16 solo
      # corren aca, en .github/workflows/.
      #
      # OJO CON EL 8, que no es el 14 del censo de `uses:` del andamio y por eso
      # se explica en vez de dejarlo raro: plantilla/.github/workflows/ tiene 14
      # `uses:`, pero 5 son marcadores sin resolver ({{ORG}}/Projects/...) que
      # este paso saltea porque no son referencias, y 1 es el
      # anthropics/claude-code-action que ya va por SHA. Quedan 8 pendientes.
      # La cuenta sale del propio paso: sus 26 anotaciones ::warning agrupadas
      # por archivo dan 16 / 8 / 2 (medido el 2026-08-24).
      #
      # Si, este paso se denuncia a si mismo: el checkout de arriba es uno de los
      # 26. Eso es lo que tiene que hacer — un auditor que se exceptua deja de ser
      # una medicion y pasa a ser una opinion.
      #
      # POR QUE ESTE PASO NO RESUELVE LOS SHA. Resolverlos exige red
      # (`gh api .../commits/<tag>`), y un SHA inventado es peor que un tag: pina
      # con confianza a un commit que no existe. Asi que el paso imprime el
      # comando exacto por cada action distinta y deja que lo cierre quien pueda
      # ejecutarlo.
      #
      # POR QUE AVISA Y NO ROMPE, y CUANDO PASA A ROJO. Estrenar esto en rojo
      # pondria en rojo el CI del marco en su primera corrida y —via plantilla/—
      # el de cualquier proyecto que se inicie despues, sin habersele anunciado a
      # nadie; es exactamente el endurecimiento sin aviso que el marco prohibe.
      # La condicion para invertirlo esta escrita y no depende de una fecha ni de
      # que alguien se acuerde: en cuanto los 26 pines de la lista de arriba esten
      # por SHA —o sea, en cuanto este paso imprima "los N uses: ... van pinados
      # por SHA de 40 hex"— se cambia el ::warning:: final por ::error:: y exit 1,
      # y se anota en el CHANGELOG bajo "Para consumidores". Antes no: un rojo que
      # nadie puede cerrar sin red ensena a ignorar los rojos.
      #
      # Lo que NO mira, declarado: no juzga si el SHA apunta a un commit real ni
      # si la version es la ultima. Eso es de Dependabot (.github/dependabot.yml),
      # que es ademas lo que impide que un pin por SHA se congele para siempre.
      - name: Pines de actions de terceros por SHA
        shell: bash
        env:
          PROPIETARIO: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          PROPIO="$(echo "${PROPIETARIO}" | tr '[:upper:]' '[:lower:]')"

          # La lista de archivos sale de git ls-files y no de un find: lo que se
          # audita es exactamente lo que el repo versiona, que es lo que se
          # ejecuta y lo que se reparte. Nada de listas que alguien tenga que
          # acordarse de ampliar cuando aparezca un workflow nuevo.
          # El `|| true` no es un fail-open: es lo contrario. Sin el, un fallo de
          # git (sin arbol, checkout parcial) mata el paso por `set -e` con el
          # mensaje de git —"not a git repository"— y sin decir que era lo que se
          # estaba auditando. Con el, el fallo cae en la condicion de abajo y sale
          # rojo igual, pero con su motivo escrito.
          ARCHIVOS="$(git ls-files -- '*.yml' '*.yaml' || true)"
          if [ -z "${ARCHIVOS}" ]; then
            echo "::error::git ls-files no devolvio ningun YAML. Este paso NO se declara verde por no haber podido medir: sin lista de archivos no audito nada. Revisa que el checkout de este job haya traido el arbol"
            exit 1
          fi

          LINEAS="$(echo "${ARCHIVOS}" | tr '\n' '\0' | xargs -0 grep -nHE '^[[:space:]]*(-[[:space:]]+)?uses:' || true)"
          if [ -z "${LINEAS}" ]; then
            echo "::error::no encontre un solo 'uses:' en los YAML del repo, y este repo es un marco de CI: eso es un patron que dejo de matchear, no un repo sin actions"
            exit 1
          fi

          TOTAL=0
          PENDIENTES=0
          ACCIONES=""
          while IFS= read -r L; do
            [ -n "${L}" ] || continue
            ARCHIVO="${L%%:*}"
            RESTO="${L#*:}"
            NUMERO="${RESTO%%:*}"

            # De la linea entera al ref: se quita todo hasta "uses:", las
            # comillas (el andamio cita los suyos por los marcadores) y el
            # comentario de version que va al lado de un SHA.
            REF="$(printf '%s\n' "${L}" \
              | sed -E 's/.*uses:[[:space:]]*//' \
              | tr -d '"'"'"'' \
              | sed -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//')"

            # Una ruta local no tiene ref que pinar: es este mismo arbol.
            case "${REF}" in
              ./*) continue ;;
            esac

            # "Ajena" se decide contra el duenio REAL del repo, no contra un
            # nombre cableado: asi un fork a otra cuenta sigue midiendo bien.
            # {{ORG}} es el marcador del andamio, que apunta al propio marco.
            DUENIO="$(echo "${REF%%/*}" | tr '[:upper:]' '[:lower:]')"
            if [ "${DUENIO}" = "${PROPIO}" ] || [ "${DUENIO}" = "{{org}}" ]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))
            REV="${REF##*@}"
            ACCION="${REF%@*}"
            # Un uses: sin @ref tampoco esta pinado: sigue el default del repo.
            case "${REV}" in
              "${REF}") ACCION="${REF}"; REV="(sin @ref)" ;;
            esac

            if printf '%s\n' "${REV}" | grep -qE '^[0-9a-f]{40}$'; then
              continue
            fi

            PENDIENTES=$((PENDIENTES + 1))
            # Se acumula con una barra vertical y no con saltos de linea porque
            # el cuerpo de este paso ya vive dentro de un bloque YAML indentado:
            # un salto de linea literal aca se lee mal y se rompe al reindentar.
            ACCIONES="${ACCIONES}${ACCION}@${REV}|"
            echo "::warning file=${ARCHIVO},line=${NUMERO}::${REF} es una action de una organizacion ajena pinada por tag movil. Quien controla ese tag puede moverlo a otro commit sin abrir un PR aca: el cambio entra a esta corrida y a la de todos los consumidores sin diff y sin aviso. Arreglo: gh api repos/${ACCION}/commits/${REV} --jq .sha , y pegar el resultado como ${ACCION}@<sha> # ${REV}"
          done <<EOF
          ${LINEAS}
          EOF

          if [ "${PENDIENTES}" -eq 0 ]; then
            echo "los ${TOTAL} uses: a organizaciones ajenas van pinados por SHA de 40 hex"
            echo "Este paso ya puede pasar a rojo: cambia el ::warning:: final por ::error:: y agrega exit 1 (ver el comentario del paso)"
            exit 0
          fi

          echo "== pines ajenos por tag movil: ${PENDIENTES} de ${TOTAL} =="
          printf '%s' "${ACCIONES}" | tr '|' '\n' | grep -v '^$' | sort | uniq -c | sort -rn
          echo
          echo "Comandos para cerrarlo, uno por action distinta (necesitan red y un gh autenticado):"
          printf '%s' "${ACCIONES}" | tr '|' '\n' | grep -v '^$' | sort -u | while IFS= read -r A; do
            echo "  gh api repos/${A%@*}/commits/${A##*@} --jq .sha"
          done
          echo

          echo "::warning::${PENDIENTES} de ${TOTAL} uses: a organizaciones ajenas van por tag movil y no por SHA, contra la frontera que AGENTS.md declara. Este paso avisa y todavia no rompe, a proposito: los SHA se resuelven con red y estrenar el rojo dejaria al marco y al andamio en rojo sin poder cerrarlo. Los comandos exactos estan arriba; cuando no quede ninguno, este paso pasa a ::error:: y exit 1"

  # EL CABLEADO DE LA CONSTITUCION, SOBRE EL PROPIO MARCO Y POR RUTA LOCAL.
  #
  # El carril del consumidor vive en marco-ci.yml y llama a la action por su ref
  # publicada; ese job se saltea en este repo a proposito, porque `uses:` no admite
  # expresiones y una ruta local dentro de un workflow reusable se resuelve contra el
  # repo de quien LLAMA, no contra el del reusable. Esta es la otra mitad de esa
  # particion, y es la misma solucion que este archivo ya usa para el reusable
  # (`./.github/workflows/marco-ci.yml`): cada PR se valida contra la version que ESE
  # PR propone, no contra la etiqueta ya publicada.
  #
  # No es decoracion de dogfooding: es lo unico que ejercita el modo `cableado` como
  # PASO DE UN JOB antes de que llegue a los consumidores. La ronda 3 de la refutacion
  # midio que, sin esto, la action se nombraba por una ref que no la tenia (@v1 no la
  # trae todavia), el job moria en "Set up job" y toda la evidencia de la compuerta era
  # local.
  #
  # Sobre este repo el veredicto esperado es "al dia" por el skip del distribuidor, que
  # NO es una ausencia: exige repartir el scaffold RASTREADO, no versionar
  # .projects-valores.json, y que ese scaffold CABLEE la verificacion con las cinco
  # condiciones. Si el scaffold deja de cablearla, este job es rojo.
  constitucion:
    name: constitucion
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Constitucion del marco cableada
        uses: ./actions/constitucion
        with:
          modo: cableado
          rama_por_defecto: ${{ github.event.repository.default_branch }}

  # Check REQUERIDO por el ruleset main-protegida (nombre exacto: "ci-ok").
  #
  # if: always() no es opcional: si "marco" falla y este job se saltea, el check
  # requerido nunca reporta y el PR queda esperando para siempre una senal que
  # no llega. El veredicto tiene que ser rojo, no ausente.
  #
  # Cuando un repo consumidor copie esta forma, aca ademas cuelga su build-test
  # (ver el encabezado de marco-ci.yml): el carril de docs lo deja "skipped" y
  # el veredicto lo cuenta como exito SOLO si la deteccion dijo solo-docs.
  # EL CHANGELOG ES OBLIGATORIO EN EL PR QUE INTRODUCE EL CAMBIO, y hasta hoy la
  # regla estaba enunciada y sin check (fila 20 del backlog de
  # docs/reglas-no-escritas.md).
  #
  # POR QUE IMPORTA MAS QUE UNA FORMALIDAD. El CHANGELOG es la UNICA superficie por
  # la que un consumidor se entera de que el marco se movio bajo sus pies: pina una
  # version exacta y recibe el bump como PR de Dependabot, y lo que lee antes de
  # mergear es esa entrada.
  #
  # Y YA FALLO, MEDIDO: el 2026-08-22 se mergeo `herramientas/projects-init.mjs` —una
  # herramienta nueva de 348 lineas— con la seccion `## [No publicado]` VACIA, y
  # ningun check se puso rojo; la entrada llego en un PR posterior. Peor que el
  # olvido es lo que habilita: la precondicion 2 de la skill `projects-release` dice que
  # si la seccion en vuelo esta vacia «no hay version que cortar», asi que un release
  # sobre un main con cambios sin anotar PASA esa precondicion mirando el lugar
  # equivocado.
  #
  # POR QUE ES ROJO Y NO AVISO. El backlog proponia estrenarlo en modo aviso una
  # semana, por la regla del marco sobre endurecimientos. No aplica aca: esa regla
  # protege a los CONSUMIDORES de un rojo que nadie les anuncio, y este check vive en
  # el ci.yml de Projects, no viaja a ningun consumidor. Los unicos afectados son los
  # builders que lo estan agregando, y un aviso dirigido a quien lo escribio no avisa.
  #
  # LO QUE MIRA Y LO QUE NO. Mira que el PR TOQUE el CHANGELOG. NO puede juzgar si lo
  # que escribiste es bueno ni si esta en la seccion correcta: eso es del review. La
  # frontera esta ahi a proposito — un check que intenta leer la calidad de una
  # entrada se pone rojo con entradas buenas, y eso ensena a ignorarlo.
  changelog:
    name: changelog-en-el-pr
    # Solo en PRs: en un push a main el PR ya se mergeo y no hay diff que mirar.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # El diff se compara contra la base del PR, y con el default (1) ese
          # commit no esta en el clon.
          fetch-depth: 0

      - name: El PR que cambia el marco toca el CHANGELOG
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Las superficies cuyo cambio LLEGA a un consumidor. `docs/` y `openspec/`
          # quedan fuera a proposito: no viajan por el carril referenciado, asi que un
          # PR que solo toca documentacion o especificacion no le mueve el piso a
          # nadie. `pruebas/` tambien: es el banco del marco, no lo que se distribuye.
          SUPERFICIES="actions .github/workflows plantilla herramientas"

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::no pude resolver el commit base del PR (${BASE}). Sin el no hay diff que mirar, y este check NO se declara verde por no haber podido medir. Arreglo: el checkout de este job necesita fetch-depth: 0"
            exit 1
          fi

          CAMBIADOS="$(git diff --name-only "${BASE}" "${CABEZA}")"

          # "Cero archivos cambiados" jamas se reporta como exito: seria un diff que
          # no se pudo leer, no un PR vacio (un PR vacio no existe).
          if [ -z "${CAMBIADOS}" ]; then
            echo "::error::el diff entre ${BASE} y ${CABEZA} salio vacio. Un PR sin archivos cambiados no existe, asi que esto es un diff que no se pudo leer"
            exit 1
          fi

          TOCA_MARCO=""
          for s in ${SUPERFICIES}; do
            if echo "${CAMBIADOS}" | grep -qE "^${s}/"; then
              TOCA_MARCO="${TOCA_MARCO} ${s}"
            fi
          done

          if [ -z "${TOCA_MARCO}" ]; then
            echo "este PR no toca ninguna superficie que viaje a un consumidor (${SUPERFICIES}): el CHANGELOG no es obligatorio"
            exit 0
          fi

          if echo "${CAMBIADOS}" | grep -qE '^CHANGELOG\.md$'; then
            echo "el PR toca${TOCA_MARCO} y tambien el CHANGELOG: OK"
            exit 0
          fi

          echo "::error::este PR cambia el marco (${TOCA_MARCO# }) y NO toca CHANGELOG.md. El CHANGELOG es la unica superficie por la que un consumidor se entera de que el marco se movio bajo sus pies, y se escribe en el PR que introduce el cambio, no al cortar la version. Arreglo: agrega tu entrada en la seccion '## [No publicado]', diciendo que tiene que hacer un consumidor (normalmente: nada)"
          exit 1

  ci_ok:
    name: ci-ok
    needs: [marco, pruebas_actions, pruebas_init, higiene, constitucion, changelog]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Veredicto
        shell: bash
        run: |
          [ "${{ needs.marco.result }}" = "success" ] || {
            echo "::error::el CI de marco termino en '${{ needs.marco.result }}'"
            exit 1
          }
          [ "${{ needs.pruebas_actions.result }}" = "success" ] || {
            echo "::error::el banco de pruebas de las actions termino en '${{ needs.pruebas_actions.result }}'"
            exit 1
          }
          # Un job con matriz reporta un solo resultado agregado: es "success"
          # solo si las TRES patas lo son. Un rojo en windows-latest o en
          # macos-latest llega aca igual que uno en ubuntu, que es justamente el
          # punto de tener la matriz.
          [ "${{ needs.pruebas_init.result }}" = "success" ] || {
            echo "::error::el banco de la herramienta de init termino en '${{ needs.pruebas_init.result }}' en al menos uno de los tres sistemas operativos. Mira cual: la herramienta corre en la maquina de quien inicia un proyecto, no en un runner, asi que un rojo en windows o macos es un rojo real para un usuario real"
            exit 1
          }
          # El paso de pines AVISA y no rompe (ver su comentario en el job
          # higiene-del-marco), asi que este job solo se pone rojo si el paso no
          # pudo medir. Que es lo correcto: "no pude auditar" nunca es verde.
          [ "${{ needs.higiene.result }}" = "success" ] || {
            echo "::error::la higiene del marco (pines de actions de terceros) termino en '${{ needs.higiene.result }}'. Ese paso avisa y no rompe por hallazgos, asi que esto significa que no pudo medir"
            exit 1
          }
          # Cualquier resultado que no sea success es un fallo, "skipped" incluido: un
          # skipped aca significaria que alguien le puso un if al job, y eso es
          # apagarlo. La doc de GitHub dice que un job salteado reporta Success, asi
          # que esta linea es la que convierte el salteo en rojo.
          [ "${{ needs.constitucion.result }}" = "success" ] || {
            echo "::error::el cableado de la constitucion (modo cableado, por ruta local) termino en '${{ needs.constitucion.result }}'"
            exit 1
          }
          # El job del CHANGELOG se saltea a proposito en un push a main: ahi el PR ya
          # se mergeo y no hay diff que mirar. Un "skipped" cuenta como exito SOLO en
          # ese caso; en un pull_request, un salteo significa que alguien le puso un
          # if al job, y eso es apagarlo.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ needs.changelog.result }}" = "success" ] || {
              echo "::error::el check del CHANGELOG en el PR termino en '${{ needs.changelog.result }}'"
              exit 1
            }
          else
            case "${{ needs.changelog.result }}" in
              success | skipped) ;;
              *)
                echo "::error::el check del CHANGELOG termino en '${{ needs.changelog.result }}'"
                exit 1
                ;;
            esac
          fi
          echo "marco: OK (solo_docs=${{ needs.marco.outputs.solo_docs }}, deteccion_confiable=${{ needs.marco.outputs.deteccion_confiable }})"
          echo "Projects no tiene build/test de producto: el veredicto es el del marco mas su banco de pruebas"
