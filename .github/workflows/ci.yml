name: CI

# CI del propio Projects — dogfooding. El marco corre sobre si mismo: valida sus
# specs de OpenSpec con el mismo workflow reusable que exporta a los proyectos
# (marco-ci.yml), asi un cambio que rompa el marco se cae aca antes de llegar a
# {{PROYECTO}}.
#
# Projects no sirve nada en runtime (no hay web ni api), asi que NO hay build/test
# de producto: el carril de docs es practicamente el unico carril. Aun asi la
# forma del CI es la misma que la del scaffold — un job "marco" y un veredicto
# "ci-ok" — para que lo que se prueba aca sea lo que se reparte.
#
# Se llama al workflow reusable por ruta LOCAL (./.github/workflows/marco-ci.yml)
# a proposito: asi cada PR se valida contra la version del marco que ESE PR
# propone, no contra la etiqueta @v1 ya publicada.
#
# DOS SUPERFICIES, DOS EXIGENCIAS DE PLATAFORMA. Casi todo lo que el marco hace
# ocurre en un runner, y ahi el marco elige el suyo: Linux x86-64 con la version de
# Node que declara el input `version_node` de marco-ci.yml, comprobado por el primer
# paso de higiene. Pero `herramientas/projects-init.mjs` NO corre en un runner: corre
# en la maquina de quien inicia un proyecto, y ahi el marco no elige NADA — ni el
# sistema operativo, que puede ser Windows, macOS o Linux, ni la version de Node, que
# es la que esa persona tenga instalada—. Por eso el unico job con matriz en este
# archivo es `pruebas-init`, y la matriz tiene DOS ejes: sistema operativo y version
# de Node. El resto sigue en ubuntu-latest con un solo Node, porque una matriz que no
# corresponde a una superficie real se paga en minutos y no compra evidencia.
on:
  push:
    branches: [main]
  pull_request:

# OBLIGATORIO y no decorativo: un workflow reusable nunca puede pedir mas
# permisos que los que le concede quien lo llama. Sin pull-requests:read, el
# job "cambios" no puede listar los archivos del PR, cae al fail-open y el
# carril rapido no actua nunca (incidente del 2026-08-05).
permissions:
  contents: read
  pull-requests: read

jobs:
  marco:
    # SIN timeout-minutes, y no es un olvido: un job que llama a un workflow reusable
    # solo admite name, uses, with, secrets, needs, if, permissions, strategy y
    # concurrency — la referencia de GitHub no lista `timeout-minutes` entre ellas. El
    # techo de esta llamada lo ponen los jobs de marco-ci.yml, que lo llevan TODOS.
    # Sin numero a proposito: la cuenta cambia cada vez que ese archivo gana un job
    # y una cifra escrita aca envejeceria sin que nada la mida.
    uses: ./.github/workflows/marco-ci.yml
    # EL TECHO QUE SE LE CONCEDE AL REUSABLE, y por eso no repite decorativamente
    # el bloque del encabezado: un workflow reusable no recibe NUNCA mas permisos
    # que los que le da quien lo llama, asi que esta es la linea que de verdad
    # decide con que corre la mecanica del marco. Escrito por job, se lee en el
    # mismo lugar que el uses:, sin subir al encabezado para saberlo. Es el gemelo
    # exacto del bloque que lleva este mismo job en el scaffold
    # (plantilla/.github/workflows/ci.yml).
    #
    # pull-requests: read NO se puede recortar: sin el, el job "cambios" de
    # marco-ci.yml no puede listar los archivos del PR, cae al fail-open y el
    # carril rapido no actua nunca (incidente del 2026-08-05).
    permissions:
      contents: read
      pull-requests: read
    # Sin "with": el CI del marco corre con los defaults que exporta, que es
    # justamente lo que hay que probar. Si un default no sirve para Projects,
    # tampoco sirve para los proyectos — se arregla el default, no este bloque.

  # Banco de pruebas de las composite actions del marco.
  #
  # POR QUE ES UN JOB PROPIO Y NO UNA BUENA PRACTICA. El marco NO puede
  # dogfoodear los checks que interrogan manifiestos de paquete: Projects no tiene
  # ninguno, asi que sobre este repo el censo de fuentes no verifica nada (el
  # mismo limite declarado que el check de marcadores del scaffold). La
  # diferencia es que estas piezas traen codigo no trivial, y su unica evidencia
  # posible son los casos sinteticos de aca mas la validacion contra un
  # consumidor real. Sin este job, ese codigo llega a todos los consumidores sin
  # que nada lo pruebe.
  #
  # El job lleva ademas el banco de los pasos INLINE de marco-ci.yml (segundo
  # paso de "casos sinteticos"): el nombre quedo por las actions, que fueron lo
  # primero que tuvo banco, pero lo que agrupa es "todo el codigo del marco que
  # se prueba con casos controlados".
  pruebas_actions:
    name: pruebas-actions
    # TECHO DE TIEMPO. El default de GitHub son 360 minutos por job: un runner colgado
    # se lleva seis horas de cola y mantiene su GITHUB_TOKEN valido todo ese rato. El
    # criterio de los numeros de este archivo es el mismo que el de claude.yml — el
    # doble largo de lo que el job tarda cuando anda bien, no un numero redondo—.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # MINIMO REAL Y DECLARADO POR JOB, no heredado del encabezado: este job clona
    # el arbol y corre `node --test` sobre el codigo de las actions y de los pasos
    # inline. No llama a ninguna API de GitHub, asi que el pull-requests: read del
    # encabezado no se le concede.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22" }

      # Que actions quedan SIN banco, derivado del arbol y no de una lista que
      # alguien tenga que acordarse de actualizar: toda action que traiga su
      # propio script .mjs deberia traer sus pruebas al lado. Hoy no puede ser
      # rojo (guardrail-deltas es anterior a esta regla y su puesta al dia es
      # otro change), pero tampoco puede pasar mudo — un fail-open silencioso es
      # justamente lo que el marco prohibe.
      - name: Que actions quedan sin banco de pruebas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          SIN_BANCO=()
          for ACCION in actions/*/; do
            SCRIPTS=("${ACCION}"*.mjs)
            if [ ${#SCRIPTS[@]} -eq 0 ]; then
              continue
            fi
            BANCO=("${ACCION}pruebas/"*.test.mjs)
            if [ ${#BANCO[@]} -eq 0 ]; then
              SIN_BANCO+=("${ACCION%/}")
            fi
          done

          if [ ${#SIN_BANCO[@]} -gt 0 ]; then
            echo "::warning::estas actions traen script propio y ningun banco de pruebas: ${SIN_BANCO[*]}. Su codigo llega a todos los consumidores de @v1 sin haberse ejecutado nunca sobre un caso controlado. Arreglo: agregar <action>/pruebas/<nombre>.test.mjs, que el paso siguiente recoge solo"
          else
            echo "toda action con script propio trae su banco de pruebas"
          fi

      # node --test es el runner que trae Node 22: cero dependencias, igual que
      # el resto del marco. Los archivos se pasan uno por uno a proposito:
      # `node --test <directorio>` no resuelve el patron en las versiones nuevas
      # de Node y el job quedaria rojo por una razon que no es la suya.
      - name: Casos sinteticos de las composite actions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          PRUEBAS=(actions/**/pruebas/*.test.mjs)

          # "No encontre pruebas" JAMAS se reporta como exito: un renombrado de
          # carpeta, un glob que deja de matchear o un checkout parcial dejarian
          # este job en verde sin haber ejecutado una sola asercion, que es
          # exactamente el fail-open mudo que el marco prohibe.
          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo de pruebas en actions/**/pruebas/*.test.mjs. Si moviste el banco de pruebas, actualiza este patron; si lo borraste, el codigo de las actions quedo sin cobertura"
            exit 1
          fi

          echo "== bancos de pruebas encontrados (node $(node --version)) =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

      # Banco de los pasos INLINE de marco-ci.yml.
      #
      # POR QUE ES UN PASO APARTE Y POR QUE HACIA FALTA. Los guardrails que
      # viven dentro de un bloque "run:" no pueden salir de ahi: marco-ci.yml es
      # un workflow reusable, asi que cuando lo llama un consumidor el arbol
      # checkouteado es el DEL CONSUMIDOR y ningun archivo de Projects esta
      # presente. Por eso ese codigo va inline, y por eso era el unico codigo del
      # marco sin una sola asercion. La auditoria del 2026-08-20 lo anoto como
      # hueco justo despues de medir, en esos mismos pasos, cuatro defectos que
      # salian en VERDE —uno de ellos en el detector de secretos— y una rama de
      # aviso que era codigo muerto.
      #
      # El banco no copia ese codigo (una copia se desincroniza y miente): lee
      # marco-ci.yml, extrae el script exacto del paso y lo corre contra
      # fixtures. Si un paso se renombra o pierde su "run:", el extractor tira y
      # esto se pone rojo en vez de dejar de probar en silencio.
      - name: Casos sinteticos de los pasos inline de marco-ci
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          TODAS=(pruebas/**/*.test.mjs)

          # Misma disciplina que el paso de arriba: "no encontre pruebas" jamas
          # se reporta como exito.
          if [ ${#TODAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo de pruebas en pruebas/**/*.test.mjs. Si moviste el banco de los pasos inline, actualiza este patron; si lo borraste, esos pasos volvieron a no tener ninguna asercion"
            exit 1
          fi

          # pruebas/init/ SE EXCLUYE ACA PORQUE CORRE EN OTRO LADO, no porque se
          # haya apagado: es el unico banco del marco cuyo sujeto no vive en un
          # runner sino en la maquina del desarrollador, asi que lo corre el job
          # `pruebas-init` sobre los tres sistemas operativos y sobre las dos
          # versiones de Node que la herramienta declara. Ejecutarlo tambien aca solo
          # repetiria la pasada de Linux con el Node del runner.
          #
          # La exclusion no puede quedar apuntando al vacio: si alguien mueve o
          # borra pruebas/init/, esta condicion se pone roja en vez de dejar de
          # excluir en silencio. (El job `pruebas-init` tambien se pondria rojo;
          # esto lo dice desde el lado que hace la exclusion, que es donde se lee
          # el motivo.)
          INIT=(pruebas/init/*.test.mjs)
          if [ ${#INIT[@]} -eq 0 ]; then
            echo "::error::este paso excluye pruebas/init/ porque el job 'pruebas-init' lo corre en una matriz de dos ejes —ubuntu, windows y macos, y ademas Node 18.17.0 y 20.12.0 sobre ubuntu—, pero pruebas/init/ no tiene ningun *.test.mjs. Si moviste ese banco, mueve tambien la exclusion y la matriz; si lo borraste, la herramienta de init se quedo sin la unica prueba que la ejercita fuera de Linux y fuera del Node del runner"
            exit 1
          fi

          PRUEBAS=()
          for P in "${TODAS[@]}"; do
            case "${P}" in
              pruebas/init/*) continue ;;
            esac
            PRUEBAS+=("${P}")
          done

          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::despues de excluir pruebas/init/ no quedo ningun banco que correr aca. O el resto de pruebas/ desaparecio, o todo se movio dentro de init/"
            exit 1
          fi

          echo "== bancos de los pasos inline encontrados (sin pruebas/init/, que corre en la matriz) =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

  # LA HERRAMIENTA DE INIT, EN LOS TRES SISTEMAS OPERATIVOS Y EN LAS DOS VERSIONES
  # DE NODE QUE ELLA MISMA DECLARA.
  #
  # DOS Y NO TRES: las que la herramienta declara son NODE_MINIMO y NODE_RECOMENDADO
  # —dos constantes, no tres—; la tercera version que aparece en la matriz es el Node
  # del runner, que no lo elige la herramienta.
  #
  # POR QUE ES UN JOB APARTE Y CON MATRIZ. `herramientas/projects-init.mjs` es la
  # unica pieza del marco que NO se ejecuta en un runner: se ejecuta en la maquina
  # de quien clona el marco para arrancar un proyecto, y esa maquina es Windows,
  # macOS o Linux segun quien sea. Hasta hoy su banco solo se habia ejecutado en
  # ubuntu-latest, dentro del job de arriba: o sea que el marco pedia que la
  # herramienta sirviera en las tres y solo tenia evidencia de una.
  #
  # EL SEGUNDO EJE ES LA VERSION DE NODE, y cierra el hueco gemelo del anterior. La
  # herramienta declara DOS numeros en su codigo —`NODE_MINIMO = "18.17.0"`, el piso
  # duro, y `NODE_RECOMENDADO = "20.12.0"`, debajo del cual avisa y sigue— y hasta
  # este cambio las dos patas de esa decision solo se ejercitaban con una version
  # SIMULADA que el banco le pasa a `revisarNodo()`. La corrida real era siempre en
  # Node 22, o sea la unica franja donde el guard no hace nada. Eso ya se pago una
  # vez y en la direccion cara: la herramienta usaba `import.meta.dirname`, que llego
  # en Node 20.11 y vale `undefined` en 18.17, asi que en el piso que ella misma
  # declaraba soportado moria con un TypeError antes de escribir un archivo. Un
  # numero que nadie ejecuta no es un piso, es una afirmacion. Los anclas de los dos
  # numeros van sin linea a proposito —ese archivo se edita seguido—:
  #   grep -n 'NODE_MINIMO\|NODE_RECOMENDADO' herramientas/projects-init.mjs
  #
  # POR QUE ESAS DOS VERSIONES Y NO UN ABANICO. 18.17.0 es el piso exacto: es donde
  # `readdirSync(..., { recursive: true })` recien existe, y un parche menos convierte
  # esa opcion en una clave desconocida que se ignora EN SILENCIO (medido en el
  # encabezado de la herramienta: 16 de 75 archivos escritos y exit 0). 20.12.0 es el
  # borde del aviso: la primera version que NO lo dispara. Las dos versiones corren
  # solo sobre ubuntu-latest: lo que ejercitan es la version del INTERPRETE, y
  # multiplicarlas por los tres sistemas operativos daria nueve patas para medir la
  # misma propiedad tres veces.
  #
  # LA PATA DE 18.17.0 ENTRA EN MODO AVISO, y el motivo esta medido y no supuesto:
  # nadie corrio nunca este banco en esa version, ni siquiera una vez, asi que su
  # primer resultado es tambien su primera medicion. Estrenarla en rojo bloquearia
  # `main` con un resultado que no se sabe leer todavia — y una de las formas de fallar
  # que tiene es que el rojo NO venga de la herramienta sino del `node --test` de esa
  # version, que es de la primera generacion del runner de pruebas. La promocion no
  # depende de que alguien se acuerde: esta escrita abajo en la propia matriz. En
  # cuanto la pata se vea verde una vez, se cambia `modo: aviso` por `modo: rojo` en
  # la entrada de 18.17.0 del `include:` y el aviso pasa a ser compuerta. La pata de
  # 20.12.0 entra en ROJO desde el primer dia: ahi el runner de pruebas ya es el
  # maduro y la herramienta afirma soporte pleno.
  #
  # fail-fast: false a proposito: si init se rompe en Windows, querer saber ademas
  # si se rompe en macOS es la mitad del diagnostico, y cancelar las otras patas lo
  # esconde. Con el segundo eje vale doble: un rojo en 18.17.0 y uno en macOS son
  # dos diagnosticos distintos y hay que verlos juntos.
  #
  # QUE HACE FALTA PARA QUE ESTO SIRVA DE VERDAD, y esta cuidado: el paso corre
  # con `shell: bash` (en windows-latest eso es el bash de Git, que viene en el
  # runner), el patron es de UN solo nivel (`pruebas/init/*.test.mjs`) para no
  # depender de `globstar`, que el bash 3.2 de macOS no tiene, y las rutas van con
  # barra normal, que Git Bash entiende. El banco en si ya es portable: usa
  # node:path, os.tmpdir() y process.execPath en vez de rutas cableadas, y la
  # herramienta trae su rama de Windows: el `openspec init` que lanza npx le pasa
  # `shell: process.platform === "win32"` a execFileSync, en
  # herramientas/projects-init.mjs. VA SIN NUMERO DE LINEA A PROPOSITO: ese
  # archivo se edita seguido y el puntero se pudre —esta misma nota ya cito una
  # linea equivocada una vez—. El ancla es `grep -n win32
  # herramientas/projects-init.mjs`, que devuelve la llamada y el parrafo del
  # encabezado que explica por que esa rama existe.
  # El .gitattributes del repo fija `* text=auto eol=lf`, asi que el checkout de
  # Windows no rematerializa CRLF y las comparaciones byte a byte del banco
  # siguen valiendo.
  pruebas_init:
    name: pruebas-init (${{ matrix.so }} · node ${{ matrix.node }})
    # 20 y no 15: la pata de windows-latest arranca mas lento que las otras dos, y el
    # techo se pone sobre la mas lenta o deja de ser techo y pasa a ser un rojo con el
    # nombre equivocado.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # DOS EJES Y CINCO PATAS, no nueve. El producto base son los tres sistemas
      # operativos sobre el Node del runner; las dos entradas de `include:` agregan
      # las dos versiones que la herramienta declara, y solo sobre ubuntu.
      #
      # POR QUE APARECEN COMO PATAS NUEVAS Y NO PISAN LAS DE ARRIBA: `node` y `modo`
      # son claves del producto base, asi que una entrada de `include:` que les da
      # otro valor no se puede fusionar con ninguna combinacion existente sin
      # sobreescribirla, y GitHub crea una combinacion nueva. Es la regla del
      # `include:`, no una casualidad de como quedo escrito; si algun dia `node`
      # saliera del producto base, estas dos entradas dejarian de sumar patas y
      # pasarian a modificar las que hay.
      #
      # `modo` NO es cosmetico: lo lee el ultimo bloque del paso de abajo y decide si
      # un banco en rojo detiene el CI o solo avisa. El motivo de que la pata de
      # 18.17.0 arranque en `aviso` esta escrito entero en el encabezado del job,
      # junto con la condicion exacta para promoverla.
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
        modo: [rojo]
        include:
          # El borde del aviso: la primera version que NO dispara el ::warning:: de
          # NODE_RECOMENDADO. Rojo desde el primer dia.
          - so: ubuntu-latest
            node: "20.12.0"
            modo: rojo
          # El piso duro exacto: NODE_MINIMO. Ver el encabezado del job para por que
          # entra avisando y que hay que ver para ponerla en rojo.
          - so: ubuntu-latest
            node: "18.17.0"
            modo: aviso
    runs-on: ${{ matrix.so }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "${{ matrix.node }}" }

      - name: Banco de la herramienta de init
        shell: bash
        # Por `env:` y no interpolado adentro del `run:`, que es la convencion del
        # repo: asi el valor de la matriz no se concatena en el texto del script.
        env:
          MODO: ${{ matrix.modo }}
          NODE_PEDIDO: ${{ matrix.node }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          PRUEBAS=(pruebas/init/*.test.mjs)

          # Misma disciplina que los demas bancos: "no encontre pruebas" jamas se
          # reporta como exito. Aca ademas la matriz lo multiplica — un patron
          # que deja de matchear daria CINCO verdes sin una sola asercion.
          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo en pruebas/init/*.test.mjs. Si moviste el banco de la herramienta de init, actualiza este patron y la exclusion del job pruebas-actions; si lo borraste, la herramienta que corre en la maquina de la gente se quedo sin banco en los tres sistemas operativos ni en las dos versiones de Node que ella misma declara soportadas"
            exit 1
          fi

          # El modo se valida en vez de suponerse: un valor que no sea ninguno de los
          # dos significa que la matriz se edito mal, y el default silencioso de un
          # `case` seria "no detiene", o sea el fail-open exacto que este bloque
          # existe para no tener.
          case "${MODO}" in
            rojo | aviso) ;;
            *)
              echo "::error::la pata de la matriz llego con modo='${MODO}', que no es 'rojo' ni 'aviso'. Lo decide la clave 'modo' del strategy.matrix de este job: si agregaste una version de Node al include:, dale tambien su modo"
              exit 1
              ;;
          esac

          echo "== banco de init en $(uname -s) ($(uname -m)), node $(node --version) (pedido: ${NODE_PEDIDO}), modo ${MODO} =="
          printf '%s\n' "${PRUEBAS[@]}"

          # El `if` alrededor del banco es lo unico que apaga el `-e` para esta linea:
          # sin el, un banco en rojo mataria el script antes de que el modo se pueda
          # leer, y la pata en aviso avisaria... poniendose roja.
          if node --test "${PRUEBAS[@]}"; then
            echo "el banco de init pasa entero en $(uname -s) con node $(node --version)"
            exit 0
          fi

          if [ "${MODO}" = "aviso" ]; then
            echo "::warning::el banco de la herramienta de init NO pasa con Node ${NODE_PEDIDO}, que es el piso duro que la propia herramienta declara (NODE_MINIMO). Esta pata avisa y no detiene PORQUE ES LA PRIMERA VEZ QUE SE MIDE: hasta este cambio el banco solo habia corrido en Node 22. Mira la salida de arriba antes de asumir nada — hay dos causas posibles y el arreglo es distinto: (a) la herramienta de verdad no funciona en ${NODE_PEDIDO}, y entonces o se arregla o NODE_MINIMO esta mintiendo y hay que subirlo; (b) el que no soporta el banco es el 'node --test' de esa version, que es de la primera generacion del runner de pruebas, y entonces lo que cambia es como se invoca el banco, no la herramienta. Cuando esta pata se vea verde una vez, promovela: en el strategy.matrix de este job, entrada del include: con node ${NODE_PEDIDO}, cambia 'modo: aviso' por 'modo: rojo'"
            exit 0
          fi

          echo "::error::el banco de la herramienta de init termino en rojo con Node ${NODE_PEDIDO} en $(uname -s). La herramienta corre en la maquina de quien inicia un proyecto, no en un runner: este rojo es un rojo real para una persona real con esa version instalada"
          exit 1

  # PINES DE ACTIONS DE TERCEROS: LA FRONTERA QUE EL MARCO DECLARA Y NADIE MEDIA.
  #
  # Se llama `higiene` por el job del mismo nombre de marco-ci.yml, del que es
  # hermano en intencion —lo que el marco AFIRMA y hasta hoy nadie verificaba—,
  # pero vive aca y no alla por una razon concreta: cuando marco-ci.yml corre en
  # un consumidor, el arbol checkouteado es el DEL CONSUMIDOR, asi que un check
  # alojado ahi auditaria los pines ajenos... del consumidor, no los del marco.
  # Los pines que este paso mira son los que el marco EJECUTA y los que REPARTE.
  higiene:
    name: higiene-del-marco
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # AGENTS.md declara la frontera textual: "Agregar una dependencia o una
      # action de terceros al marco: entra al pipeline de todos los consumidores.
      # Se pina por SHA, no por tag movil ajeno." Nada la verificaba.
      # VA SIN NUMERO DE LINEA A PROPOSITO, igual que la nota de win32 del job
      # pruebas-init: AGENTS.md se edita seguido y el puntero se pudre. El ancla es
      # `grep -n 'action de terceros al marco' AGENTS.md`.
      #
      # POR QUE IMPORTA MAS QUE UN PIN CUALQUIERA. Es la unica clase de cambio que
      # llega a todos los consumidores a la vez sin que nadie mergee nada: mover un
      # tag ajeno no abre un PR, no produce diff y no dispara aviso. La asimetria
      # que lo hacia evidente ya no existe, y decirlo importa porque este parrafo
      # la usaba de argumento: hasta este cambio la unica action de terceros pinada
      # por SHA era anthropics/claude-code-action, y las de GitHub —que corren en
      # cada job de cada repo— iban por tag. Hoy las de este arbol tambien van por
      # SHA; lo que queda pendiente es lo que el marco REPARTE.
      #
      # ESTADO MEDIDO EL 2026-08-25, DESPUES DE CERRAR EL ANDAMIO: cero `uses:` a
      # organizaciones ajenas por tag movil. El censo completo, con el comando que lo
      # reproduce (git ls-files -- '*.yml' '*.yaml' | xargs grep -hE '^[[:space:]]*(-[[:space:]]+)?uses:'):
      #      40  invocaciones, sin contar las que llevan marcador {{...}}
      #      34  por SHA de 40 hex, con el tag en el comentario de al lado
      #       6  por tag, y las SEIS son el marco apuntandose a si mismo:
      #            4  rutas locales (./.github/..., ./actions/...)
      #            2  im-diego-ec/Projects/actions/... por version del propio marco
      # Esas seis NO son deuda: un repo no se pina por SHA a si mismo, y la version
      # exacta es justamente el canal por el que un consumidor recibe los cambios.
      # Lo que cerro este censo fue el ANDAMIO: sus 8 invocaciones viajaban por tag a
      # cada proyecto nuevo, y hoy van por SHA como las del marco.
      #
      # OJO CON EL 8, que no es el 14 del censo de `uses:` del andamio y por eso
      # se explica en vez de dejarlo raro: plantilla/.github/workflows/ tiene 14
      # `uses:`, pero 5 son marcadores sin resolver ({{ORG}}/Projects/...) que este
      # paso saltea porque no son referencias, y 1 es el anthropics/claude-code-action
      # que ya va por SHA. Quedan 8 pendientes.
      #
      # LOS NUMEROS NO SE MANTIENEN A MANO, Y YA SE PUDRIERON DOS VECES: este parrafo
      # decia 27 de 29, con 15/11/1 y 17/8/2, y despues 31 de 33 con 21/8/2, y las dos
      # veces dejo de cerrar en cuanto un cambio agrego jobs con checkout y setup-node
      # sin que nadie los volviera a contar (la segunda fue el job terraform de
      # marco-ci.yml, que suma un checkout). Los mide ESTE MISMO PASO, y sus
      # anotaciones ::warning agrupadas por archivo dan hoy 0 / 8 / 2 —
      # .github/workflows/, plantilla/ y actions/—. Si un cambio agrega un `uses:`
      # ajeno, la corrida imprime el total nuevo y este parrafo queda viejo a la
      # vista, que es preferible a un total que nadie puede reproducir — pero "a la
      # vista" solo sirve si alguien mira: la regla es que el PR que agrega un
      # `uses:` ajeno remide estas cifras.
      #
      # Si, este paso se sigue auditando a si mismo: el checkout de arriba es uno de
      # los 24 que hoy van por SHA, y el dia que alguien lo devuelva a un tag este
      # mismo paso lo denuncia. Eso es lo que tiene que hacer — un auditor que se
      # exceptua deja de ser una medicion y pasa a ser una opinion.
      #
      # POR QUE ESTE PASO NO RESUELVE LOS SHA. Resolverlos exige red
      # (`gh api .../commits/<tag>`), y un SHA inventado es peor que un tag: pina
      # con confianza a un commit que no existe. Asi que el paso imprime el
      # comando exacto por cada action distinta y deja que lo cierre quien pueda
      # ejecutarlo.
      #
      # POR QUE AVISA Y NO ROMPE, y CUANDO PASA A ROJO. Estrenar esto en rojo
      # pondria en rojo el CI del marco en su primera corrida y —via plantilla/—
      # el de cualquier proyecto que se inicie despues, sin habersele anunciado a
      # nadie; es exactamente el endurecimiento sin aviso que el marco prohibe.
      # La condicion para invertirlo esta escrita y no depende de una fecha ni de
      # que alguien se acuerde: en cuanto los 10 pines de la lista de arriba esten
      # por SHA —o sea, en cuanto este paso imprima "los N uses: ... van pinados
      # por SHA de 40 hex"— se cambia el ::warning:: final por ::error:: y exit 1,
      # y se anota en el CHANGELOG bajo "Para consumidores". Antes no: un rojo que
      # nadie puede cerrar sin red ensena a ignorar los rojos.
      #
      # Y ESTA MAS CERCA DE LO QUE PARECE, con el trabajo repartido escrito: los 10
      # que faltan viven en CINCO archivos, ninguno de ellos este workflow —
      # plantilla/.github/workflows/ci.yml (5), .../actualizar-marco.yml (2),
      # .../claude.yml (1), y los action.yml de cobertura-diff y de guardrail-deltas
      # (1 cada uno)—. Dos de las tres actions que les faltan ya estan resueltas en
      # este mismo arbol y se copian de las lineas `uses:` de aca en vez de
      # resolverse otra vez: actions/checkout # v7 y actions/setup-node # v7. La
      # tercera, actions/upload-artifact, no se invoca en .github/workflows y su
      # unica linea vive en el andamio; su SHA para el tag v5 es
      # 330a01c490aca151604b8cf639adc76d48f6c5d4, resuelto contra la API publica y
      # anotado aca para que ese cambio tampoco necesite red.
      #
      # Lo que NO mira, declarado: no juzga si el SHA apunta a un commit real ni
      # si la version es la ultima. Eso es de Dependabot (.github/dependabot.yml),
      # que es ademas lo que impide que un pin por SHA se congele para siempre.
      - name: Pines de actions de terceros por SHA
        shell: bash
        env:
          PROPIETARIO: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          PROPIO="$(echo "${PROPIETARIO}" | tr '[:upper:]' '[:lower:]')"

          # La lista de archivos sale de git ls-files y no de un find: lo que se
          # audita es exactamente lo que el repo versiona, que es lo que se
          # ejecuta y lo que se reparte. Nada de listas que alguien tenga que
          # acordarse de ampliar cuando aparezca un workflow nuevo.
          # El `|| true` no es un fail-open: es lo contrario. Sin el, un fallo de
          # git (sin arbol, checkout parcial) mata el paso por `set -e` con el
          # mensaje de git —"not a git repository"— y sin decir que era lo que se
          # estaba auditando. Con el, el fallo cae en la condicion de abajo y sale
          # rojo igual, pero con su motivo escrito.
          ARCHIVOS="$(git ls-files -- '*.yml' '*.yaml' || true)"
          if [ -z "${ARCHIVOS}" ]; then
            echo "::error::git ls-files no devolvio ningun YAML. Este paso NO se declara verde por no haber podido medir: sin lista de archivos no audito nada. Revisa que el checkout de este job haya traido el arbol"
            exit 1
          fi

          LINEAS="$(echo "${ARCHIVOS}" | tr '\n' '\0' | xargs -0 grep -nHE '^[[:space:]]*(-[[:space:]]+)?uses:' || true)"
          if [ -z "${LINEAS}" ]; then
            echo "::error::no encontre un solo 'uses:' en los YAML del repo, y este repo es un marco de CI: eso es un patron que dejo de matchear, no un repo sin actions"
            exit 1
          fi

          TOTAL=0
          PENDIENTES=0
          ACCIONES=""
          while IFS= read -r L; do
            [ -n "${L}" ] || continue
            ARCHIVO="${L%%:*}"
            RESTO="${L#*:}"
            NUMERO="${RESTO%%:*}"

            # De la linea entera al ref: se quita todo hasta "uses:", las
            # comillas (el andamio cita los suyos por los marcadores) y el
            # comentario de version que va al lado de un SHA.
            REF="$(printf '%s\n' "${L}" \
              | sed -E 's/.*uses:[[:space:]]*//' \
              | tr -d '"'"'"'' \
              | sed -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//')"

            # Una ruta local no tiene ref que pinar: es este mismo arbol.
            case "${REF}" in
              ./*) continue ;;
            esac

            # "Ajena" se decide contra el duenio REAL del repo, no contra un
            # nombre cableado: asi un fork a otra cuenta sigue midiendo bien.
            # {{ORG}} es el marcador del andamio, que apunta al propio marco.
            DUENIO="$(echo "${REF%%/*}" | tr '[:upper:]' '[:lower:]')"
            if [ "${DUENIO}" = "${PROPIO}" ] || [ "${DUENIO}" = "{{org}}" ]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))
            REV="${REF##*@}"
            ACCION="${REF%@*}"
            # Un uses: sin @ref tampoco esta pinado: sigue el default del repo.
            case "${REV}" in
              "${REF}") ACCION="${REF}"; REV="(sin @ref)" ;;
            esac

            if printf '%s\n' "${REV}" | grep -qE '^[0-9a-f]{40}$'; then
              continue
            fi

            PENDIENTES=$((PENDIENTES + 1))
            # Se acumula con una barra vertical y no con saltos de linea porque
            # el cuerpo de este paso ya vive dentro de un bloque YAML indentado:
            # un salto de linea literal aca se lee mal y se rompe al reindentar.
            ACCIONES="${ACCIONES}${ACCION}@${REV}|"
            echo "::warning file=${ARCHIVO},line=${NUMERO}::${REF} es una action de una organizacion ajena pinada por tag movil. Quien controla ese tag puede moverlo a otro commit sin abrir un PR aca: el cambio entra a esta corrida y a la de todos los consumidores sin diff y sin aviso. Arreglo: gh api repos/${ACCION}/commits/${REV} --jq .sha , y pegar el resultado como ${ACCION}@<sha> # ${REV}"
          done <<EOF
          ${LINEAS}
          EOF

          if [ "${PENDIENTES}" -eq 0 ]; then
            echo "los ${TOTAL} uses: a organizaciones ajenas van pinados por SHA de 40 hex"
            echo "Este paso ya puede pasar a rojo: cambia el ::warning:: final por ::error:: y agrega exit 1 (ver el comentario del paso)"
            exit 0
          fi

          echo "== pines ajenos por tag movil: ${PENDIENTES} de ${TOTAL} =="
          printf '%s' "${ACCIONES}" | tr '|' '\n' | grep -v '^$' | sort | uniq -c | sort -rn
          echo
          echo "Comandos para cerrarlo, uno por action distinta (necesitan red y un gh autenticado):"
          printf '%s' "${ACCIONES}" | tr '|' '\n' | grep -v '^$' | sort -u | while IFS= read -r A; do
            echo "  gh api repos/${A%@*}/commits/${A##*@} --jq .sha"
          done
          echo

          echo "::warning::${PENDIENTES} de ${TOTAL} uses: a organizaciones ajenas van por tag movil y no por SHA, contra la frontera que AGENTS.md declara. Este paso avisa y todavia no rompe, a proposito: los SHA se resuelven con red y estrenar el rojo dejaria al marco y al andamio en rojo sin poder cerrarlo. Los comandos exactos estan arriba; cuando no quede ninguno, este paso pasa a ::error:: y exit 1"

      - name: El pipeline que reparte el andamio tambien pasa actionlint
        shell: bash
        env:
          VERSION_ACTIONLINT: "1.7.12"
        run: |
          set -euo pipefail

          # POR QUE ES UN PASO APARTE Y NO SALE GRATIS CON LA HIGIENE DE ARRIBA.
          # actionlint descubre workflows mirando SOLO `.github/workflows/` de la RAIZ:
          # `plantilla/` nunca entra. Medido el 2026-08-25: con un SC2086 vivo en
          # plantilla/.github/workflows/ci.yml —la lista de raices de Terraform sin
          # comillas— actionlint en la raiz salia EXIT 0, y cada repo nacido del andamio
          # arrancaba con su CI en ROJO por una linea que el marco nunca habia mirado.
          # El marco validaba su propio pipeline y no el que le reparte a todo el mundo.
          #
          # Y NO SE PUEDE LINTEAR plantilla/ TAL CUAL: sus workflows llevan marcadores
          # {{ASI}} que shellcheck lee como sintaxis rota (SC1083) y llenan la salida de
          # ruido que no existe en ningun repo real. Por eso se INSTANCIA primero con los
          # valores de ejemplo de la propia herramienta, y se lintea el resultado — que
          # es, byte por byte, el archivo que recibe el consumidor.

          TMP="$(mktemp -d)"
          node herramientas/projects-init.mjs --ejemplo > "${TMP}/valores.json"
          mkdir -p "${TMP}/repo"
          # `--sin-arranque` ademas de `--sin-herramientas`: lo que este paso lintea son
          # los .yml YA renderizados, y para eso no hace falta instalar dependencias ni
          # generar el cliente de datos ni verificar el proyecto. Arrancarlo aca ataria
          # un lint de sintaxis de workflows al registro de npm y a minutos de install:
          # una caida del registro se leeria como "el andamio no pasa actionlint", que
          # es exactamente el diagnostico equivocado.
          node herramientas/projects-init.mjs \
            --valores "${TMP}/valores.json" --destino "${TMP}/repo" --sin-herramientas --sin-arranque > /dev/null

          if [ ! -d "${TMP}/repo/.github/workflows" ]; then
            echo "::error::el andamio instanciado no dejo .github/workflows: o projects-init fallo, o el andamio dejo de repartir su pipeline. En los dos casos este paso NO declara verde"
            exit 1
          fi

          CUANTOS="$(find "${TMP}/repo/.github/workflows" -name '*.yml' | wc -l | tr -d ' ')"
          if [ "${CUANTOS}" -eq 0 ]; then
            echo "::error::cero workflows en el andamio instanciado. Un cero aca es este paso roto, no un andamio limpio"
            exit 1
          fi
          echo "linteando ${CUANTOS} workflow(s) del andamio instanciado"

          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION_ACTIONLINT}"
          TAR="actionlint_${VERSION_ACTIONLINT}_linux_amd64.tar.gz"
          curl -fsSL --max-time 60 --retry 2 --retry-all-errors -o "${TMP}/${TAR}" "${BASE}/${TAR}"
          curl -fsSL --max-time 60 --retry 2 --retry-all-errors -o "${TMP}/sums.txt" "${BASE}/actionlint_${VERSION_ACTIONLINT}_checksums.txt"
          ( cd "${TMP}" && grep " ${TAR}\$" sums.txt | sha256sum --check --ignore-missing )
          tar -xzf "${TMP}/${TAR}" -C "${TMP}" actionlint

          if ! ( cd "${TMP}/repo" && git init -q . && "${TMP}/actionlint" -color ); then
            echo "::error::el pipeline que el andamio reparte no pasa actionlint (archivo y linea, arriba). Ese archivo es el que recibe cada proyecto nuevo, asi que esto no es un detalle del marco: es un CI en rojo el dia uno del consumidor. Reproducilo local: instancia el andamio y corre actionlint dentro"
            exit 1
          fi
          echo "el pipeline del andamio pasa actionlint"

      # EL MARCO NO SE AUTO-IDENTIFICA POR UN LITERAL DE SU CUENTA.
      #
      # QUE CIERRA. marco-ci.yml decidia dos cosas comparando `github.repository`
      # contra el slug del repo escrito literal: si el job constitucion-cableada corre,
      # y si marco-ok acepta que se haya salteado. Un literal se vuelve mentira en
      # cuanto el arbol cambia de cuenta —ya paso una vez, en el renombrado— y el modo
      # de falla es el peor posible: en una copia a OtraCuenta/Projects el literal deja
      # de coincidir, el job ARRANCA, y "Set up job" descarga y ejecuta una composite
      # action de la cuenta ORIGINAL en cada PR de cada repo que consuma esa copia.
      # Nada lo miraba: `grep -rn 'github.repository' pruebas/ actions/*/pruebas/` da
      # cero lineas, hoy tambien.
      #
      # LO QUE SE BUSCA ES LA CUENTA, NO EL SLUG DE DOS SEGMENTOS, y la diferencia no
      # es cosmetica: la primera version de este paso buscaba "<cuenta>/Projects" y por
      # lo tanto dejaba pasar en VERDE la misma falla escrita con la cuenta sola
      # —`github.repository_owner != '<la cuenta>'` en el `if` del job de la
      # constitucion, con la cuenta escrita literal—, que rompe exactamente igual al
      # copiar el arbol. Fijar una forma sintactica no es fijar la propiedad. La parte
      # que rota entre copias es la CUENTA (el nombre del repo no viaja), asi que el
      # literal a perseguir es la cuenta — y perseguirla cubre tambien al slug, que la
      # contiene.
      #
      # POR QUE VIVE ACA Y NO EN pruebas/. El banco de marco-ci.yml extrae el bloque
      # `run:` de un PASO y lo corre contra fixtures; las dos comparaciones del slug no
      # estan en un `run:` sino en el `if` de un job y en una expresion, que ese
      # extractor no alcanza. Un paso que lee el arbol si las ve, y ademas ve la
      # proxima, que puede aparecer en cualquiera de los cuatro workflows.
      #
      # LA PROPIEDAD QUE SE VERIFICA, y por que se puede: fuera de un `uses:`, el marco
      # NO escribe el nombre de su cuenta. Las comparaciones se derivan de
      # `github.repository_owner`. Los `uses:` quedan exentos POR LA REFERENCIA, no por
      # comodidad: GitHub prohibe expresiones ahi, asi que ese literal es la unica
      # forma que existe — y por eso el comentario de esas lineas trae el comando que
      # una copia corre para cambiarlas.
      #
      # Las lineas de COMENTARIO tambien quedan fuera: un comentario que explica por
      # que la cuenta no puede ir en el codigo tiene que poder escribirla, y sin esta
      # regla este mismo bloque pondria rojo el paso. Es el mismo limite que ya declara
      # el paso de ejecutores pinados de marco-ci.yml.
      #
      # ALCANCE DECLARADO: solo .github/workflows/, que es donde viven las
      # comparaciones. plantilla/ queda fuera a proposito — ahi la cuenta llega por el
      # marcador {{ORG}} del andamio, que es otra pieza con otro dueno.
      #
      # ROJO Y NO AVISO, con el mismo argumento que el check del CHANGELOG de mas
      # abajo: este paso vive en el ci.yml de Projects y no viaja a ningun consumidor,
      # asi que el unico afectado es quien acaba de escribir la linea. Y esta medido en
      # verde: hoy la cuenta aparece TRES veces en .github/workflows y las tres estan
      # exentas —los dos `uses:` de marco-ci.yml y un comentario de ese mismo archivo
      # que trae el grep para encontrarlos—. El comando que lo remide:
      #   git ls-files -- '.github/workflows/*.yml' | tr '\n' '\0' \
      #     | xargs -0 grep -cHF -- '<la cuenta>'
      - name: El marco no se auto-identifica por un literal de su cuenta
        shell: bash
        env:
          PROPIETARIO: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # La cuenta sale de lo que GitHub dice que es este repo, no de un literal: un
          # check contra el auto-nombramiento no puede auto-nombrarse. Y si llegara
          # vacia no hay caso sano que reportar: `grep -F ""` matchea TODAS las lineas
          # de todos los workflows, o sea que el paso se volveria ruido en vez de
          # medicion. Vacio es rojo, no verde mudo.
          CUENTA="${PROPIETARIO}"
          if [ -z "${CUENTA}" ]; then
            echo "::error::github.repository_owner llego vacio, asi que no hay contra que comparar. Este paso NO se declara verde por no haber podido medir"
            exit 1
          fi
          echo "la cuenta de este repo, segun el evento: ${CUENTA}"

          ARCHIVOS="$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')"
          if [ -z "${ARCHIVOS}" ]; then
            echo "::error::git ls-files no devolvio ningun workflow. Este paso NO se declara verde por no haber podido medir: sin archivos no audito nada"
            exit 1
          fi

          # -F: la cuenta es TEXTO, no un patron. El `|| true` no es un fail-open: grep
          # sale 1 cuando no encontro nada, que es el caso sano de este paso, y el
          # unico que hay que distinguir —"no pude mirar"— ya lo cerro la guarda de
          # ARCHIVOS de arriba.
          TODAS="$(echo "${ARCHIVOS}" | tr '\n' '\0' | xargs -0 grep -nHF -- "${CUENTA}" || true)"
          TOTAL=0
          HALLAZGOS=0
          while IFS= read -r L; do
            [ -n "${L}" ] || continue
            TOTAL=$((TOTAL + 1))
            ARCHIVO="${L%%:*}"
            RESTO="${L#*:}"
            NUMERO="${RESTO%%:*}"
            TEXTO="${RESTO#*:}"
            # Comentario o `uses:`: las dos exenciones declaradas arriba, en un solo
            # ancla. Un `if` y no un `&&` encadenado: con `set -e`, un `&&` que
            # termina en falso como ultimo comando del cuerpo mata el bucle.
            if printf '%s\n' "${TEXTO}" | grep -qE '^[[:space:]]*(#|(-[[:space:]]+)?uses:)'; then
              continue
            fi
            HALLAZGOS=$((HALLAZGOS + 1))
            echo "::error file=${ARCHIVO},line=${NUMERO}::esta linea escribe el nombre de la cuenta de este repositorio (${CUENTA}) fuera de un uses:, sola o dentro del slug. Un literal deja de coincidir en cuanto el arbol se copia a otra cuenta, y ahi el marco deja de reconocerse a si mismo: el job de la constitucion arranca en la copia y termina descargando la composite action de la cuenta ORIGINAL en cada PR de cada consumidor. Arreglo: derivala del contexto github.repository_owner —en una expresion del workflow, o por env dentro del run, que es la convencion de este repo—. En un uses: no se puede, porque GitHub prohibe expresiones ahi, y por eso solo esas lineas estan exentas"
          done <<EOF
          ${TODAS}
          EOF

          if [ "${HALLAZGOS}" -gt 0 ]; then
            echo "== ${HALLAZGOS} de ${TOTAL} ocurrencia(s) de la cuenta estan fuera de un uses: =="
            exit 1
          fi

          echo "ninguna de las ${TOTAL} ocurrencia(s) de ${CUENTA} en .github/workflows esta fuera de un uses: o de un comentario"

  # EL CABLEADO DE LA CONSTITUCION, SOBRE EL PROPIO MARCO Y POR RUTA LOCAL.
  #
  # El carril del consumidor vive en marco-ci.yml y llama a la action por su ref
  # publicada; ese job se saltea en este repo a proposito, porque `uses:` no admite
  # expresiones y una ruta local dentro de un workflow reusable se resuelve contra el
  # repo de quien LLAMA, no contra el del reusable. Esta es la otra mitad de esa
  # particion, y es la misma solucion que este archivo ya usa para el reusable
  # (`./.github/workflows/marco-ci.yml`): cada PR se valida contra la version que ESE
  # PR propone, no contra la etiqueta ya publicada.
  #
  # No es decoracion de dogfooding: es lo unico que ejercita el modo `cableado` como
  # PASO DE UN JOB antes de que llegue a los consumidores. La ronda 3 de la refutacion
  # midio que, sin esto, la action se nombraba por una ref que no la tenia (@v1 no la
  # trae todavia), el job moria en "Set up job" y toda la evidencia de la compuerta era
  # local.
  #
  # Sobre este repo el veredicto esperado es "al dia" por el skip del distribuidor, que
  # NO es una ausencia: exige repartir el scaffold RASTREADO, no versionar
  # .projects-valores.json, y que ese scaffold CABLEE la verificacion con las cinco
  # condiciones. Si el scaffold deja de cablearla, este job es rojo.
  constitucion:
    name: constitucion
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22" }
      - name: Constitucion del marco cableada
        uses: ./actions/constitucion
        with:
          modo: cableado
          rama_por_defecto: ${{ github.event.repository.default_branch }}

  # EL GUARDRAIL DE DELTAS, SOBRE EL PROPIO MARCO Y POR RUTA LOCAL.
  #
  # Es la segunda mitad de la MISMA particion que el job de arriba, y aparece porque
  # `actions/guardrail-deltas` dejo de invocarse desde el job openspec de marco-ci.yml
  # y paso a su propio job `deltas-openspec`, que se saltea en el repo que distribuye
  # el marco. Sin este job, el marco dejaria de ejercitar su propio guardrail de
  # deltas: los changes de openspec/ de este repo pasarian sin que nadie compruebe que
  # un bloque "## MODIFIED Requirements" no borra escenarios.
  #
  # Igual que con la constitucion, la ruta local no es comodidad: cada PR valida contra
  # la version de la action que ESE PR propone, no contra la etiqueta ya publicada.
  # `uses:` no admite expresiones y una ruta local dentro de un workflow reusable se
  # resuelve contra el arbol de quien llama, asi que las dos formas no caben en el
  # mismo paso.
  deltas:
    name: deltas-openspec
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22" }
      - name: Deltas de OpenSpec sin perdida de escenarios
        uses: ./actions/guardrail-deltas
        with:
          instalar-node: "false"

  # EL CHECK QUE MAIN VA A EXIGIR, y hoy NO exige: "ci-ok" (nombre exacto).
  #
  # Este comentario decia "check REQUERIDO por el ruleset main-protegida" y era una
  # compuerta afirmada y no medida. Medido el 2026-08-24, contra las dos formas en
  # que GitHub protege una rama:
  #   gh api repos/im-diego-ec/Projects/rulesets              -> []
  #   gh api repos/im-diego-ec/Projects/branches/main/protection  -> 404
  # O sea que no hay ruleset ni proteccion heredada: este job corre y reporta, y
  # nadie lo exige. Un repo que AFIRMA una compuerta que no existe esta peor que uno
  # que no afirma ninguna, porque el que lo lee deja de buscar. El estado real, la
  # tabla entera y los pasos para aplicarla viven en .github/proteccion-main.md, y
  # se remiden con esos dos comandos antes de creerle a esta linea.
  #
  # Nada de lo de abajo depende de eso: el nombre del job es el contrato publico
  # —lo que se agrega como check requerido el dia que el ruleset exista— y por eso
  # renombrarlo es breaking aunque hoy no lo exija nadie.
  #
  # if: always() no es opcional: si "marco" falla y este job se saltea, el check
  # requerido nunca reporta y el PR queda esperando para siempre una senal que
  # no llega. El veredicto tiene que ser rojo, no ausente.
  #
  # Cuando un repo consumidor copie esta forma, aca ademas cuelga su build-test
  # (ver el encabezado de marco-ci.yml): el carril de docs lo deja "skipped" y
  # el veredicto lo cuenta como exito SOLO si la deteccion dijo solo-docs.
  # EL CHANGELOG ES OBLIGATORIO EN EL PR QUE INTRODUCE EL CAMBIO, y hasta hoy la
  # regla estaba enunciada y sin check (fila 20 del backlog de
  # docs/07-reglas-no-escritas.md).
  #
  # POR QUE IMPORTA MAS QUE UNA FORMALIDAD. El CHANGELOG es la UNICA superficie por
  # la que un consumidor se entera de que el marco se movio bajo sus pies: pina una
  # version exacta y recibe el bump como PR de Dependabot, y lo que lee antes de
  # mergear es esa entrada.
  #
  # Y YA FALLO, MEDIDO: el 2026-08-22 se mergeo `herramientas/projects-init.mjs` —una
  # herramienta nueva de 348 lineas— con la seccion `## [No publicado]` VACIA, y
  # ningun check se puso rojo; la entrada llego en un PR posterior. Peor que el
  # olvido es lo que habilita: la precondicion 2 de la skill `projects-release` dice que
  # si la seccion en vuelo esta vacia «no hay version que cortar», asi que un release
  # sobre un main con cambios sin anotar PASA esa precondicion mirando el lugar
  # equivocado.
  #
  # POR QUE ES ROJO Y NO AVISO. El backlog proponia estrenarlo en modo aviso una
  # semana, por la regla del marco sobre endurecimientos. No aplica aca: esa regla
  # protege a los CONSUMIDORES de un rojo que nadie les anuncio, y este check vive en
  # el ci.yml de Projects, no viaja a ningun consumidor. Los unicos afectados son los
  # builders que lo estan agregando, y un aviso dirigido a quien lo escribio no avisa.
  #
  # LO QUE MIRA Y LO QUE NO. Mira que el PR TOQUE el CHANGELOG. NO puede juzgar si lo
  # que escribiste es bueno ni si esta en la seccion correcta: eso es del review. La
  # frontera esta ahi a proposito — un check que intenta leer la calidad de una
  # entrada se pone rojo con entradas buenas, y eso ensena a ignorarlo.
  changelog:
    name: changelog-en-el-pr
    # Solo en PRs: en un push a main el PR ya se mergeo y no hay diff que mirar.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # El diff se compara contra la base del PR, y con el default (1) ese
          # commit no esta en el clon.
          fetch-depth: 0

      - name: El PR que cambia el marco toca el CHANGELOG
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Las superficies cuyo cambio LLEGA a un consumidor. `docs/` y `openspec/`
          # quedan fuera a proposito: no viajan por el carril referenciado, asi que un
          # PR que solo toca documentacion o especificacion no le mueve el piso a
          # nadie. `pruebas/` tambien: es el banco del marco, no lo que se distribuye.
          #
          # DE `.github/workflows/` VIAJA UNO SOLO, y la distincion no es un matiz:
          # marco-ci.yml es el reusable que los consumidores invocan con `uses:`. Los
          # otros tres son el CI del marco sobre si mismo (ci.yml), su bot (claude.yml)
          # y su aviso de release (aviso-version.yml): nadie los hereda. Con el
          # directorio entero en la lista, CADA bump de Dependabot sobre esos tres
          # nacia en ROJO PERMANENTE por un CHANGELOG que Dependabot no escribe nunca,
          # y una regla que garantiza rojo en una clase entera de PRs ensena a ignorar
          # el rojo — justo lo que el comentario de arriba dice que hay que evitar. El
          # andamio no necesita excepcion: sus workflows viajan y los cubre `plantilla`.
          SUPERFICIES="actions .github/workflows/marco-ci.yml plantilla herramientas"

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::no pude resolver el commit base del PR (${BASE}). Sin el no hay diff que mirar, y este check NO se declara verde por no haber podido medir. Arreglo: el checkout de este job necesita fetch-depth: 0"
            exit 1
          fi

          CAMBIADOS="$(git diff --name-only "${BASE}" "${CABEZA}")"

          # "Cero archivos cambiados" jamas se reporta como exito: seria un diff que
          # no se pudo leer, no un PR vacio (un PR vacio no existe).
          if [ -z "${CAMBIADOS}" ]; then
            echo "::error::el diff entre ${BASE} y ${CABEZA} salio vacio. Un PR sin archivos cambiados no existe, asi que esto es un diff que no se pudo leer"
            exit 1
          fi

          TOCA_MARCO=""
          for s in ${SUPERFICIES}; do
            # El ancla acepta las dos formas: un directorio (`actions/...`) y un
            # archivo suelto (`.github/workflows/marco-ci.yml`).
            if echo "${CAMBIADOS}" | grep -qE "^${s}(/|\$)"; then
              TOCA_MARCO="${TOCA_MARCO} ${s}"
            fi
          done

          if [ -z "${TOCA_MARCO}" ]; then
            echo "este PR no toca ninguna superficie que viaje a un consumidor (${SUPERFICIES}): el CHANGELOG no es obligatorio"
            exit 0
          fi

          if echo "${CAMBIADOS}" | grep -qE '^CHANGELOG\.md$'; then
            echo "el PR toca${TOCA_MARCO} y tambien el CHANGELOG: OK"
            exit 0
          fi

          echo "::error::este PR cambia el marco (${TOCA_MARCO# }) y NO toca CHANGELOG.md. El CHANGELOG es la unica superficie por la que un consumidor se entera de que el marco se movio bajo sus pies, y se escribe en el PR que introduce el cambio, no al cortar la version. Arreglo: agrega tu entrada en la seccion '## [No publicado]', diciendo que tiene que hacer un consumidor (normalmente: nada)"
          exit 1

  ci_ok:
    name: ci-ok
    needs: [marco, pruebas_actions, pruebas_init, higiene, constitucion, deltas, changelog]
    if: always()
    # 5 minutos: no hace checkout ni toca la red, solo lee los resultados de sus needs.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # VACIO A PROPOSITO, igual que su gemelo del scaffold: este job no clona el
    # arbol, no llama a ninguna API y no lee mas que los resultados de sus needs,
    # que vienen del contexto y no del token. Su GITHUB_TOKEN no necesita ni
    # contents: read. Un bloque vacio dice "se audito y da cero", que no es lo
    # mismo que no haber mirado.
    permissions: {}
    steps:
      - name: Veredicto
        shell: bash
        run: |
          [ "${{ needs.marco.result }}" = "success" ] || {
            echo "::error::el CI de marco termino en '${{ needs.marco.result }}'"
            exit 1
          }
          [ "${{ needs.pruebas_actions.result }}" = "success" ] || {
            echo "::error::el banco de pruebas de las actions termino en '${{ needs.pruebas_actions.result }}'"
            exit 1
          }
          # Un job con matriz reporta un solo resultado agregado: es "success" solo si
          # TODAS sus patas lo son. Hoy son CINCO —tres sistemas operativos con el Node
          # del runner, mas Node 20.12.0 y 18.17.0 sobre ubuntu— y un rojo en
          # cualquiera de ellas llega aca igual que uno en ubuntu, que es justamente el
          # punto de tener la matriz. La pata de 18.17.0 esta en modo aviso: si falla,
          # sale verde con un ::warning:: en su propio log y NO llega hasta aca. El
          # motivo y la condicion de promocion estan en el encabezado de ese job.
          [ "${{ needs.pruebas_init.result }}" = "success" ] || {
            echo "::error::el banco de la herramienta de init termino en '${{ needs.pruebas_init.result }}' en al menos una de las cinco patas de su matriz. Mira cual: la herramienta corre en la maquina de quien inicia un proyecto, no en un runner, asi que un rojo en windows, en macos o en la version de Node que la herramienta declara como piso es un rojo real para un usuario real"
            exit 1
          }
          # El job higiene-del-marco lleva DOS pasos con dos severidades distintas, y
          # el mensaje las nombra porque el arreglo es distinto: el de pines AVISA y
          # no rompe (los SHA se resuelven con red), asi que si el rojo viene de ahi es
          # que no pudo medir; el del slug literal SI rompe por hallazgo, y ahi el
          # arreglo es la linea que el propio paso anota.
          [ "${{ needs.higiene.result }}" = "success" ] || {
            echo "::error::la higiene del marco termino en '${{ needs.higiene.result }}'. Mira cual de sus dos pasos: el de pines de actions de terceros avisa y no rompe por hallazgos, asi que un rojo suyo significa que no pudo medir; el del slug literal si rompe por hallazgo y deja la linea anotada"
            exit 1
          }
          # Cualquier resultado que no sea success es un fallo, "skipped" incluido: un
          # skipped aca significaria que alguien le puso un if al job, y eso es
          # apagarlo. La doc de GitHub dice que un job salteado reporta Success, asi
          # que esta linea es la que convierte el salteo en rojo.
          [ "${{ needs.constitucion.result }}" = "success" ] || {
            echo "::error::el cableado de la constitucion (modo cableado, por ruta local) termino en '${{ needs.constitucion.result }}'"
            exit 1
          }
          # La otra mitad de la misma particion. Mismo criterio: un "skipped" aca es
          # apagar el unico lugar donde el marco ejercita su propio guardrail de
          # deltas, porque en marco-ci.yml ese job se saltea justamente en este repo.
          [ "${{ needs.deltas.result }}" = "success" ] || {
            echo "::error::el guardrail de deltas de OpenSpec (por ruta local) termino en '${{ needs.deltas.result }}'"
            exit 1
          }
          # El job del CHANGELOG se saltea a proposito en un push a main: ahi el PR ya
          # se mergeo y no hay diff que mirar. Un "skipped" cuenta como exito SOLO en
          # ese caso; en un pull_request, un salteo significa que alguien le puso un
          # if al job, y eso es apagarlo.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ needs.changelog.result }}" = "success" ] || {
              echo "::error::el check del CHANGELOG en el PR termino en '${{ needs.changelog.result }}'"
              exit 1
            }
          else
            case "${{ needs.changelog.result }}" in
              success | skipped) ;;
              *)
                echo "::error::el check del CHANGELOG termino en '${{ needs.changelog.result }}'"
                exit 1
                ;;
            esac
          fi
          echo "marco: OK (solo_docs=${{ needs.marco.outputs.solo_docs }}, deteccion_confiable=${{ needs.marco.outputs.deteccion_confiable }})"
          echo "Projects no tiene build/test de producto: el veredicto es el del marco mas su banco de pruebas"
