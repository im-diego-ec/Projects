name: CI

# CI del propio Projects — dogfooding. El marco corre sobre si mismo: valida sus
# specs de OpenSpec con el mismo workflow reusable que exporta a los proyectos
# (marco-ci.yml), asi un cambio que rompa el marco se cae aca antes de llegar a
# {{PROYECTO}}.
#
# Projects no sirve nada en runtime (no hay web ni api), asi que NO hay build/test
# de producto: el carril de docs es practicamente el unico carril. Aun asi la
# forma del CI es la misma que la del scaffold — un job "marco" y un veredicto
# "ci-ok" — para que lo que se prueba aca sea lo que se reparte.
#
# Se llama al workflow reusable por ruta LOCAL (./.github/workflows/marco-ci.yml)
# a proposito: asi cada PR se valida contra la version del marco que ESE PR
# propone, no contra la etiqueta @v1 ya publicada.
on:
  push:
    branches: [main]
  pull_request:

# OBLIGATORIO y no decorativo: un workflow reusable nunca puede pedir mas
# permisos que los que le concede quien lo llama. Sin pull-requests:read, el
# job "cambios" no puede listar los archivos del PR, cae al fail-open y el
# carril rapido no actua nunca (incidente del 2026-08-05).
permissions:
  contents: read
  pull-requests: read

jobs:
  marco:
    uses: ./.github/workflows/marco-ci.yml
    # Sin "with": el CI del marco corre con los defaults que exporta, que es
    # justamente lo que hay que probar. Si un default no sirve para Projects,
    # tampoco sirve para los proyectos — se arregla el default, no este bloque.

  # Banco de pruebas de las composite actions del marco.
  #
  # POR QUE ES UN JOB PROPIO Y NO UNA BUENA PRACTICA. El marco NO puede
  # dogfoodear los checks que interrogan manifiestos de paquete: Projects no tiene
  # ninguno, asi que sobre este repo el censo de fuentes no verifica nada (el
  # mismo limite declarado que el check de marcadores del scaffold). La
  # diferencia es que estas piezas traen codigo no trivial, y su unica evidencia
  # posible son los casos sinteticos de aca mas la validacion contra un
  # consumidor real. Sin este job, ese codigo llega a todos los consumidores sin
  # que nada lo pruebe.
  #
  # El job lleva ademas el banco de los pasos INLINE de marco-ci.yml (segundo
  # paso de "casos sinteticos"): el nombre quedo por las actions, que fueron lo
  # primero que tuvo banco, pero lo que agrupa es "todo el codigo del marco que
  # se prueba con casos controlados".
  pruebas_actions:
    name: pruebas-actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      # Que actions quedan SIN banco, derivado del arbol y no de una lista que
      # alguien tenga que acordarse de actualizar: toda action que traiga su
      # propio script .mjs deberia traer sus pruebas al lado. Hoy no puede ser
      # rojo (guardrail-deltas es anterior a esta regla y su puesta al dia es
      # otro change), pero tampoco puede pasar mudo — un fail-open silencioso es
      # justamente lo que el marco prohibe.
      - name: Que actions quedan sin banco de pruebas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          SIN_BANCO=()
          for ACCION in actions/*/; do
            SCRIPTS=("${ACCION}"*.mjs)
            if [ ${#SCRIPTS[@]} -eq 0 ]; then
              continue
            fi
            BANCO=("${ACCION}pruebas/"*.test.mjs)
            if [ ${#BANCO[@]} -eq 0 ]; then
              SIN_BANCO+=("${ACCION%/}")
            fi
          done

          if [ ${#SIN_BANCO[@]} -gt 0 ]; then
            echo "::warning::estas actions traen script propio y ningun banco de pruebas: ${SIN_BANCO[*]}. Su codigo llega a todos los consumidores de @v1 sin haberse ejecutado nunca sobre un caso controlado. Arreglo: agregar <action>/pruebas/<nombre>.test.mjs, que el paso siguiente recoge solo"
          else
            echo "toda action con script propio trae su banco de pruebas"
          fi

      # node --test es el runner que trae Node 22: cero dependencias, igual que
      # el resto del marco. Los archivos se pasan uno por uno a proposito:
      # `node --test <directorio>` no resuelve el patron en las versiones nuevas
      # de Node y el job quedaria rojo por una razon que no es la suya.
      - name: Casos sinteticos de las composite actions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          PRUEBAS=(actions/**/pruebas/*.test.mjs)

          # "No encontre pruebas" JAMAS se reporta como exito: un renombrado de
          # carpeta, un glob que deja de matchear o un checkout parcial dejarian
          # este job en verde sin haber ejecutado una sola asercion, que es
          # exactamente el fail-open mudo que el marco prohibe.
          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo de pruebas en actions/**/pruebas/*.test.mjs. Si moviste el banco de pruebas, actualiza este patron; si lo borraste, el codigo de las actions quedo sin cobertura"
            exit 1
          fi

          echo "== bancos de pruebas encontrados (node $(node --version)) =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

      # Banco de los pasos INLINE de marco-ci.yml.
      #
      # POR QUE ES UN PASO APARTE Y POR QUE HACIA FALTA. Los guardrails que
      # viven dentro de un bloque "run:" no pueden salir de ahi: marco-ci.yml es
      # un workflow reusable, asi que cuando lo llama un consumidor el arbol
      # checkouteado es el DEL CONSUMIDOR y ningun archivo de Projects esta
      # presente. Por eso ese codigo va inline, y por eso era el unico codigo del
      # marco sin una sola asercion. La auditoria del 2026-08-20 lo anoto como
      # hueco justo despues de medir, en esos mismos pasos, cuatro defectos que
      # salian en VERDE —uno de ellos en el detector de secretos— y una rama de
      # aviso que era codigo muerto.
      #
      # El banco no copia ese codigo (una copia se desincroniza y miente): lee
      # marco-ci.yml, extrae el script exacto del paso y lo corre contra
      # fixtures. Si un paso se renombra o pierde su "run:", el extractor tira y
      # esto se pone rojo en vez de dejar de probar en silencio.
      - name: Casos sinteticos de los pasos inline de marco-ci
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          PRUEBAS=(pruebas/**/*.test.mjs)

          # Misma disciplina que el paso de arriba: "no encontre pruebas" jamas
          # se reporta como exito.
          if [ ${#PRUEBAS[@]} -eq 0 ]; then
            echo "::error::no se encontro ningun archivo de pruebas en pruebas/**/*.test.mjs. Si moviste el banco de los pasos inline, actualiza este patron; si lo borraste, esos pasos volvieron a no tener ninguna asercion"
            exit 1
          fi

          echo "== bancos de los pasos inline encontrados =="
          printf '%s\n' "${PRUEBAS[@]}"

          node --test "${PRUEBAS[@]}"

  # Check REQUERIDO por el ruleset main-protegida (nombre exacto: "ci-ok").
  #
  # if: always() no es opcional: si "marco" falla y este job se saltea, el check
  # requerido nunca reporta y el PR queda esperando para siempre una senal que
  # no llega. El veredicto tiene que ser rojo, no ausente.
  #
  # Cuando un repo consumidor copie esta forma, aca ademas cuelga su build-test
  # (ver el encabezado de marco-ci.yml): el carril de docs lo deja "skipped" y
  # el veredicto lo cuenta como exito SOLO si la deteccion dijo solo-docs.
  ci_ok:
    name: ci-ok
    needs: [marco, pruebas_actions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Veredicto
        shell: bash
        run: |
          [ "${{ needs.marco.result }}" = "success" ] || {
            echo "::error::el CI de marco termino en '${{ needs.marco.result }}'"
            exit 1
          }
          [ "${{ needs.pruebas_actions.result }}" = "success" ] || {
            echo "::error::el banco de pruebas de las actions termino en '${{ needs.pruebas_actions.result }}'"
            exit 1
          }
          echo "marco: OK (solo_docs=${{ needs.marco.outputs.solo_docs }}, deteccion_confiable=${{ needs.marco.outputs.deteccion_confiable }})"
          echo "Projects no tiene build/test de producto: el veredicto es el del marco mas su banco de pruebas"
